<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注销带单员流程</title>
<style>

:root{
  --green:#35B85C; --green-bg:#E8F7EC; --green-dk:#23964A;
  --text:#14161A; --sub:#8B9099; --sub2:#B4B8BF;
  --card:#F4F5F7; --line:#ECEDEF; --bg:#FFFFFF;
  --red:#E5484D; --red-bg:#FDECEC;
  --warn:#A86A0C; --warn-bg:#FFF5E0;
  --page:#E9EBEE;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
.wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:28px 16px}
/* phone */
.phone{width:375px;height:800px;background:var(--bg);border-radius:36px;box-shadow:0 0 0 10px #1b1d21,0 20px 50px rgba(0,0,0,.25);position:relative;overflow:hidden;flex:none;display:flex;flex-direction:column}
.statusbar{height:40px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-weight:600;font-size:14px}
#screen{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.appnav{flex:none;height:64px;margin:0 14px 14px;background:var(--card);border-radius:32px;display:flex;justify-content:space-around;align-items:center}
.appnav div{font-size:11px;color:var(--sub);text-align:center;width:56px}
.appnav div i{display:block;width:20px;height:20px;margin:0 auto 3px;border-radius:5px;background:#C9CDD3}
.appnav div.on{color:var(--green)} .appnav div.on i{background:var(--green)}
/* module header */
.mhead{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 0}
.mhead h1{font-size:26px;font-weight:800;letter-spacing:.5px}
.icon-btn{width:32px;height:32px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.icon-btn:hover{background:var(--card)}
.tabs{display:flex;gap:20px;padding:0 18px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 0 10px;font-size:15px;color:var(--sub);position:relative;white-space:nowrap;flex:none}
.tabs button.on{color:var(--text);font-weight:700}
.tabs button.on:after{content:"";position:absolute;left:50%;bottom:-1px;width:20px;height:3px;border-radius:2px;background:var(--green);transform:translateX(-50%)}
.tabs .dot{display:inline-block;margin-left:4px;font-size:10px;color:var(--green);background:var(--green-bg);border-radius:8px;padding:1px 5px;vertical-align:2px;font-weight:600}
.body{padding:14px 18px 24px}
/* generic */
.card{background:var(--card);border-radius:16px;padding:16px}
.lbl{font-size:12px;color:var(--sub)}
.v{font-size:15px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.up{color:var(--green)} .down{color:var(--red)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid3>div:nth-child(2){text-align:center} .grid3>div:nth-child(3){text-align:right}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;font-weight:500;vertical-align:2px}
.tag.run{color:var(--green-dk);background:var(--green-bg)}
.tag.end{color:var(--sub);background:#E3E5E8}
.tag.mine{color:#fff;background:var(--text)}
.tag.warn{color:var(--warn);background:var(--warn-bg)}
.btn{height:44px;border-radius:22px;font-weight:600;font-size:15px;width:100%}
.btn.pri{background:var(--green);color:#fff}
.btn.dark{background:var(--text);color:#fff}
.btn.gray{background:#E3E5E8;color:var(--text)}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{height:34px;font-size:13px;border-radius:17px}
.pill{height:30px;padding:0 14px;border-radius:15px;font-size:13px;font-weight:600}
.pill.pri{background:var(--green);color:#fff}
.pill.line{background:#fff;border:1px solid #D9DCE0}
.link{color:var(--green-dk);font-weight:500}
.chev:after{content:"›";margin-left:3px;font-size:16px;line-height:1}
.chips{display:flex;gap:8px;margin:2px 0 12px}
.chips button{height:30px;padding:0 14px;border-radius:15px;background:var(--card);color:var(--sub);font-size:13px}
.chips button.on{background:#E2E4E8;color:var(--text);font-weight:600}
/* banner */
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--green-bg);margin-bottom:14px}
.banner b{font-size:14px} .banner p{font-size:12px;color:var(--sub);margin-top:2px}
.banner.warn{background:var(--warn-bg)} .banner.warn b{color:var(--warn)}
.banner.mute{background:var(--card)}
/* project card (discover) */
.pcard{padding:16px 0;border-bottom:1px solid var(--line)}
.pcard:last-child{border-bottom:0}
.prow{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:18px;background:var(--green-bg);color:var(--green-dk);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.who{flex:1;min-width:0}
.pname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:12px;color:var(--sub);margin-top:2px}
.pmid{display:flex;justify-content:space-between;align-items:flex-end;margin:12px 0}
.roi{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.roi.na{color:var(--sub2)}
/* lead center */
.prof{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prof .av{width:48px;height:48px;border-radius:24px;font-size:20px}
.prof .nm{font-size:18px;font-weight:800}
.subtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:14px 0 12px}
.subtabs button{padding:10px 0 8px;font-size:15px;color:var(--sub);position:relative}
.subtabs button.on{color:var(--text);font-weight:700}
.subtabs button.on:after{content:"";position:absolute;left:50%;bottom:-1px;width:18px;height:3px;border-radius:2px;background:var(--green);transform:translateX(-50%)}
.lcard{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.lcard .t{font-size:16px;font-weight:700}
.lcard .id{font-size:12px;color:var(--sub);margin:4px 0 12px;font-variant-numeric:tabular-nums}
.lcard .two{display:flex;justify-content:space-between}
.lcard .two>div:last-child{text-align:right}
.lcard .time{font-size:11px;color:var(--sub);margin:12px 0}
.lcard .acts{display:flex;gap:10px}
.empty{text-align:center;padding:36px 0 20px;color:var(--sub)}
.empty .ic{width:64px;height:48px;border-radius:10px;background:var(--green-bg);margin:0 auto 12px}
.empty p{font-size:13px;margin-bottom:14px}
.subtabs .newproj{margin-left:auto;color:var(--green-dk);font-weight:600;font-size:14px}
.subtabs .newproj:disabled{color:var(--sub2);cursor:not-allowed}
/* forms & rows */
.field{margin-bottom:18px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.field input,.field textarea{width:100%;border:0;background:var(--card);border-radius:10px;padding:12px;font:inherit;font-size:15px;outline:none;color:var(--text)}
.field textarea{height:84px;resize:none}
.err{font-size:12px;color:var(--red);margin-top:6px;min-height:0}
.rows .row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.rows .row .lbl{margin-top:3px}
.btn.line,.pill.line{background:#fff;border:1px solid #D9DCE0;color:var(--text)}
.pill:disabled{opacity:.4;cursor:not-allowed}
.btn.dis,.pill.dis{background:#E8EAED;color:#A6ABB3}
/* trade */
.tacct{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tproj{display:flex;align-items:center;justify-content:space-between;background:var(--green-bg);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.tproj b{font-size:14px}
.sym{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.sym .s{font-size:20px;font-weight:800}
.sym .px{font-size:22px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;text-align:right}
.trow{display:flex;gap:8px;margin-bottom:10px}
.trow>*{flex:1}
.box{height:42px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
.seg2{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:10px}
.seg2 button{flex:1;height:36px;border-radius:8px;color:var(--sub);font-weight:600}
.seg2 button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.inp{display:flex;align-items:center;height:48px;border-radius:10px;background:var(--card);padding:0 12px;margin-bottom:10px}
.inp span{font-size:12px;color:var(--sub);width:44px;flex:none}
.inp input{flex:1;border:0;background:none;font:inherit;font-size:15px;font-weight:600;outline:none;min-width:0;color:var(--text)}
.inp em{font-style:normal;font-size:13px;color:var(--sub)}
.avail{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:4px 2px 12px}
.avail b{color:var(--text);font-weight:600}
.btn.long{background:var(--green);color:#fff} .btn.short{background:var(--red);color:#fff}
.pos{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
.pos .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pos .h b{font-size:14px}
.side{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;margin-right:6px}
.side.l{color:var(--green-dk);background:var(--green-bg)} .side.s{color:var(--red);background:var(--red-bg)}
.entry{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-top:1px solid var(--line);margin-top:16px;font-size:14px}
.entry span:last-child{color:var(--sub)}
/* quit flow */
.nav{display:flex;align-items:center;height:44px;padding:0 10px;position:sticky;top:0;background:#fff;z-index:2}
.nav .ttl{flex:1;text-align:center;font-size:17px;font-weight:700;margin-right:32px}
.sec-t{font-size:15px;font-weight:700;margin:20px 0 10px}
.check{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--card);margin-bottom:10px}
.check .st{width:22px;height:22px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin-top:1px}
.st.ok{background:var(--green)} .st.no{background:var(--red)} .st.wait{background:#E4A23A} .st.info{background:#9AA0A8}
.check .c{flex:1}
.check .c b{font-size:14px} .check .c p{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
.check .c .act{margin-top:8px}
.conseq{font-size:13px;line-height:1.7;color:#454A52;padding-left:18px}
.conseq li{margin-bottom:4px}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:18px 0 12px;cursor:pointer;user-select:none}
.agree i{width:18px;height:18px;border-radius:5px;border:1.5px solid #C3C7CD;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:12px}
.agree.on i{background:var(--green);border-color:var(--green)}
.hint{font-size:12px;color:var(--red);text-align:center;margin-top:8px}
.result{text-align:center;padding:56px 24px 0}
.result .big{width:64px;height:64px;border-radius:32px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;font-weight:700}
.result h2{font-size:20px;margin-bottom:10px}
.result p{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:26px;text-align:left}
.warnmark{color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 4px;font-size:12px;white-space:nowrap}
/* overlay */
#overlay{position:absolute;inset:0;z-index:20;display:none}
#overlay.show{display:block}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:8px 0 22px}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:#DADDE1;margin:4px auto 10px}
.sheet .item{display:block;width:100%;text-align:left;padding:15px 22px;font-size:15px}
.sheet .item:hover{background:var(--card)}
.sheet .item small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.sheet .item.red{color:var(--red)}
.sheet .cancel{border-top:8px solid var(--card);text-align:center}
.sheet h3{font-size:16px;padding:4px 22px 10px}
.modal{position:absolute;left:28px;right:28px;top:50%;transform:translateY(-50%);background:#fff;border-radius:18px;padding:22px 20px 18px}
.modal h3{font-size:17px;text-align:center;margin-bottom:10px}
.modal p{font-size:13px;color:#545A63;line-height:1.65;margin-bottom:18px}
.modal .acts{display:flex;gap:10px}
#toast{position:absolute;left:50%;top:72px;transform:translateX(-50%);background:rgba(20,22,26,.9);color:#fff;font-size:13px;padding:9px 14px;border-radius:10px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:300px;text-align:center}
#toast.show{opacity:1}
/* panel */
/* storyboard */
body{background:#E9EBEE}
.page{max-width:1240px;margin:0 auto;padding:32px 20px 60px}
.page>h1{font-size:26px;font-weight:800;margin-bottom:6px}
.page>.sub{font-size:13px;color:var(--sub);margin-bottom:22px;line-height:1.6}
.pbox{background:#fff;border-radius:16px;padding:20px 22px;margin-bottom:28px}
.pbox h2{font-size:16px;margin-bottom:12px}
table.mx{width:100%;border-collapse:collapse;font-size:13px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top;line-height:1.55}
table.mx th{color:var(--sub);font-weight:500;font-size:12px;background:#FAFAFB}
table.mx td.id{font-weight:700;white-space:nowrap}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 20px;font-size:12.5px;color:#454A52;line-height:1.6}
.rules b{color:var(--text)}
.sec{margin:34px 0 14px}
.sec h2{font-size:19px;font-weight:800}
.sec p{font-size:13px;color:var(--sub);margin-top:4px}
.grid{display:flex;flex-wrap:wrap;gap:30px 26px}
.shot{width:375px;margin:0}
.shot .phone{height:812px;box-shadow:0 0 0 8px #1b1d21,0 14px 34px rgba(0,0,0,.18);border-radius:34px}
.scr{flex:1;overflow:hidden;position:relative}
.shot .body{padding-bottom:8px}
.shot .conseq li{margin-bottom:2px}
.ov{position:absolute;inset:0;z-index:20}
.shot figcaption{margin-top:18px;font-size:13px;line-height:1.6;color:#454A52}
.shot figcaption b{display:block;font-size:14px;color:var(--text);margin-bottom:2px}
.shot figcaption .no{display:inline-block;font-size:11px;font-weight:700;background:var(--text);color:#fff;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.rtag{display:inline-block;font-size:11px;color:var(--green-dk);background:var(--green-bg);border-radius:4px;padding:0 5px;margin-left:4px}
.hl{outline:2px solid #FF5A5F;outline-offset:3px;border-radius:12px}
.stoast{position:absolute;left:50%;top:46%;transform:translateX(-50%);background:rgba(20,22,26,.9);color:#fff;font-size:13px;line-height:1.5;padding:10px 16px;border-radius:10px;z-index:30;width:max-content;max-width:280px;text-align:center}
.fm{padding:4px 18px 0}
.fm .f{margin-bottom:16px}
.fm .f>label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.fm .ipt{height:46px;border-radius:10px;background:var(--card);display:flex;align-items:center;padding:0 14px;font-size:15px;color:var(--text);font-weight:600}
.fm .ipt.ph{color:var(--sub2);font-weight:400;font-size:14px}
.fm .ipt em{font-style:normal;margin-left:auto;color:var(--sub);font-weight:400;font-size:13px}
.fm .ta{height:76px;border-radius:10px;background:var(--card);padding:12px 14px;font-size:14px;color:var(--sub2)}
.fm .hint2{font-size:12px;color:var(--sub);margin-top:6px;display:flex;justify-content:space-between}
.fm .range{display:flex;align-items:center;gap:10px}.fm .range .ipt{flex:1}
.fm .avatar{display:flex;justify-content:space-between;align-items:center}
.fm .avatar span{width:44px;height:44px;border-radius:22px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--sub)}
.sw{width:42px;height:24px;border-radius:12px;background:var(--green);position:relative;flex:none}.sw:after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:9px;background:#fff}
.wm{display:inline-block;font-size:11px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:500;vertical-align:1px}
@media (max-width:820px){.shot{width:100%;max-width:375px}}
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
/* 纯静态截图：以下函数只负责拼接静态页面，无交互 */
const APPNAV = `<div class="appnav"><div><i></i>首页</div><div><i></i>市场</div><div class="on"><i></i>交易</div><div><i></i>理财</div><div><i></i>资产</div></div>`;
const phone = (inner, o={}) => `<div class="phone"><div class="statusbar"><span>15:30</span><span style="font-size:12px">●●● 5G ▮</span></div><div class="scr">${inner}</div>${o.app?APPNAV:''}${o.ov?`<div class="ov"><div class="mask"></div>${o.ov}</div>`:''}${o.toast?`<div class="stoast">${o.toast}</div>`:''}</div>`;
const navBar = t => `<div class="nav"><span class="icon-btn">‹</span><div class="ttl">${t}</div><div style="min-width:32px"></div></div>`;
const head = (active, o={}) => `<div class="mhead" style="padding-bottom:10px;border-bottom:1px solid var(--line)"><h1>跟单</h1><div>${active==='lead'?`<span class="icon-btn ${o.hlMore?'hl':''}">•••</span>`:''}</div></div>`;
const runCard = (o={}) => `<div class="lcard">
  <div class="t">BTC 趋势策略 <span class="tag run">进行中</span></div><div class="id">3680227388765021</div>
  <div class="two"><div><div class="lbl">项目余额 (USDT)</div><div class="v">${o.bal||'106.85'}</div></div><div><div class="lbl">累计盈亏 (USDT)</div><div class="v up">+19.25</div></div></div>
  <div class="time">开始时间 2026-10-11　|　跟单 3/500　|　持仓 ${o.pos??1}</div>
  <div class="acts"><button class="btn sm dark" ${o.quitting?'disabled':''}>去带单</button><button class="btn sm gray ${o.hlEnd?'hl':''}">结束项目</button></div></div>`;
const endCard = (name='高胜率项目', pnl='+1.69', share='0.00', s='2026-10-12', e='2026-10-12') => `<div class="lcard">
  <div class="t">${name} <span class="tag end">已结束</span></div><div class="id">3680227388765020</div>
  <div class="two"><div><div class="lbl">累计盈亏 (USDT)</div><div class="v ${pnl[0]==='-'?'down':'up'}">${pnl}</div></div><div><div class="lbl">累计分润 (USDT)</div><div class="v">${share}</div></div></div>
  <div class="time">开始时间 ${s}　|　结束时间 ${e}</div><button class="btn sm gray">详情</button></div>`;
const leadCenter = (o={}) => head('lead',{lead:true,quitting:o.quitting,hlMore:o.hlMore}) + `<div class="body">
  ${o.quitting?`<div class="banner warn ${o.hlBanner?'hl':''}"><div><b>注销处理中</b><p>本期分润（每周结算）结算后自动生效，期间不可新建项目、不可带单交易</p></div><span class="link" style="white-space:nowrap">撤回</span></div>`:''}
  <div class="prof"><div class="av">T</div><div style="flex:1;min-width:0"><div class="nm">Trader10002298 <span class="tag run">带单员</span></div><div class="psub">带单 3 天</div></div><span class="lbl chev" style="white-space:nowrap">编辑资料</span></div>
