<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 管家 · 对话 Agent 原型</title>
<style>
:root{
 --ink:#0F1419;--ink2:#2B3139;--muted:#6B7480;--faint:#9AA3AE;--line:#E6E8EB;--line2:#F0F1F3;
 --bg:#EEF0F2;--panel:#FFFFFF;--soft:#F5F6F7;
 --up:#0B9B5C;--upbg:#E7F6EE;--down:#D9304F;--downbg:#FCEBEE;--warn:#C27C0E;--warnbg:#FDF4E3;
 --app:#5BC466;--appbg:#EAF7EC;--brand:#0F7B5F;--brandbg:#E6F4EF;--ai1:#19C08A;--ai2:#0E9F9A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:var(--ink);background:var(--bg);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr 340px;height:100vh}
/* 左侧旅程导航 */
aside.nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 18px 12px}
.brand b{font-size:15px;display:block}
.brand span{font-size:11.5px;color:var(--muted)}
.navlist{overflow-y:auto;padding:0 10px 20px;flex:1}
.navlist h4{font-size:11.5px;font-weight:600;color:var(--muted);margin:14px 8px 4px}
.navlist button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;font-size:13px;padding:7px 8px;border-radius:8px}
.navlist button:hover{background:var(--soft)}
.navlist button[aria-current=true]{background:var(--brandbg);color:var(--brand);font-weight:600}
.navlist .new{font-size:10px;color:var(--brand);border:1px solid #BFE3D6;border-radius:4px;padding:0 4px;margin-left:auto;font-weight:500}
.mbar{display:none}
/* 中间舞台 */
main{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:18px 16px;overflow:auto;min-width:0}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px;align-self:stretch;text-align:center}
.crumb b{color:var(--ink)}
.device{width:390px;height:800px;border-radius:44px;background:#0F1419;padding:9px;box-shadow:0 24px 50px rgba(15,20,25,.18);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff}
/* 右侧说明栏 */
aside.notes{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px}
.notes h2{font-size:15px;margin:2px 0 2px}
.notes .jr{font-size:11.5px;color:var(--muted)}
.notes h5{font-size:11.5px;color:var(--muted);font-weight:600;margin:16px 0 6px;letter-spacing:.2px}
.notes p,.notes li{font-size:12.5px;line-height:1.6;color:var(--ink2);margin:0}
.notes ol,.notes ul{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:3px}
.chipsr{display:flex;flex-wrap:wrap;gap:6px}
.rtag{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--brandbg);color:var(--brand)}
.qtag{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--warnbg);color:var(--warn)}
.demo{margin-top:16px;padding:12px;border-radius:10px;background:var(--soft)}
.demo h5{margin-top:0}
.seg{display:inline-flex;background:#E9EBEE;border-radius:8px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;font-size:12px;padding:5px 9px;border-radius:6px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.demo .row{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.demo .row:last-child{margin-bottom:0}
.demo label{font-size:11.5px;color:var(--muted)}
.replay{margin-top:12px;width:100%;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px}

/* ===== 手机内部 ===== */
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;flex:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scroll{flex:1;overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar{width:0}
.hp{padding:4px 16px 100px;display:flex;flex-direction:column;gap:16px}
.hp .top{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:16px;background:#EEF1F4;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.search{flex:1;height:34px;border-radius:17px;background:var(--soft);display:flex;align-items:center;padding:0 14px;color:var(--faint);font-size:12.5px}
.asset small{font-size:12px;color:var(--muted)}
.asset .v{font-size:28px;font-weight:700;margin:2px 0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.tiles i{width:40px;height:40px;border-radius:12px;background:var(--soft);display:block;position:relative}
.tiles i::after{content:"";position:absolute;inset:13px;border-radius:4px;border:2px solid #C5CBD2}
.mkt{display:flex;flex-direction:column}
.mkt .h{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}
.mkt .h b{color:var(--ink)}
.mrow{display:grid;grid-template-columns:1fr auto 72px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);gap:10px}
.mrow b{font-size:14px}
.pill{font-size:12px;font-weight:600;padding:5px 0;border-radius:6px;text-align:center;color:#fff}
.pill.up{background:var(--up)}.pill.down{background:var(--down)}
/* 底部悬浮导航：左侧 AI 入口独立成圆，右侧胶囊 tab */
.tabnav{position:absolute;left:10px;right:10px;bottom:16px;display:flex;align-items:center;gap:8px;z-index:5}
.navbar{flex:1;min-width:0;height:60px;border-radius:30px;background:rgba(255,255,255,.97);box-shadow:0 6px 20px rgba(15,20,25,.12);display:flex;align-items:center;padding:0 4px}
.navbar button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--ink2);padding:0;white-space:nowrap}
.navbar .ic{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--ink2);display:grid;place-items:center;font-size:11px;line-height:1}
.navbar .on .ic{width:42px;height:42px;border-radius:21px;background:var(--ink);border:0;color:#fff;font-size:17px}
.navbar .on .l{display:none}
.homebar{position:absolute;left:50%;bottom:5px;width:120px;height:4px;border-radius:2px;background:#C9CED4;transform:translateX(-50%);z-index:5}
.orb{position:relative;flex:none;width:60px;height:60px;border-radius:30px;background:#fff;box-shadow:0 6px 18px rgba(15,20,25,.16);display:grid;place-items:center;border:0;padding:0}
.orb i{width:38px;height:38px;border-radius:19px;display:block;margin-top:-6px;background:radial-gradient(circle at 35% 30%,#8CF0C8,var(--ai1) 45%,var(--ai2));animation:breath 3.2s ease-in-out infinite}
.orb em{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--ink);border-radius:6px;padding:0 5px;line-height:14px}
.orb.pending i{background:radial-gradient(circle at 35% 30%,#FFE08A,#F0A81E 50%,#C77C0A)}
.orb.danger i{background:radial-gradient(circle at 35% 30%,#FF9AA8,#E5384F 50%,#B01F37)}
.orb.pending::after,.orb.danger::after{content:"";position:absolute;inset:-4px;border-radius:35px;border:2px solid;opacity:.5;animation:pulse 1.8s ease-out infinite}
.orb.pending::after{border-color:#F0A81E}.orb.danger::after{border-color:#E5384F}
.orb .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--down);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.orb.pending .badge{background:#E08B00}
/* App 框架（参照线上 App 截图）：首页、交易菜单、现货 / 合约 / 跟单 / CFD / 理财 */
.xic{width:26px;height:26px;display:grid;place-items:center;font-size:15px;color:var(--ink2);position:relative;flex:none}
.xic.dot::after{content:"";position:absolute;top:1px;right:1px;width:6px;height:6px;border-radius:3px;background:var(--down)}
.xasset{display:flex;justify-content:space-between;align-items:flex-start}
.xasset small{font-size:12px;color:var(--muted)}
.xasset .v{font-size:28px;font-weight:700;margin:4px 0}
.chg{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:14px;margin-top:14px}
.chg.down{background:var(--downbg);color:var(--down)}
.xbtn{height:42px;border-radius:21px;border:0;background:var(--app);color:#fff;font-weight:700;font-size:14.5px;width:100%}
.xbtn.dn{background:#EF4359}
.xbtn.sm{height:28px;width:auto;padding:0 14px;font-size:12px;border-radius:14px}
.xshort{display:flex;overflow-x:auto;margin:0 -16px;padding:0 10px}
.xshort::-webkit-scrollbar,.xmk::-webkit-scrollbar{display:none}
.xshort button{flex:none;width:72px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);padding:0}
.xshort i{width:30px;height:30px;border-radius:15px;background:#C9CDD2;display:block}
.xcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xcard{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:4px}
.xcard.xbig{grid-row:span 2;min-height:210px}
.xcard small{font-size:11.5px;color:var(--muted)}
.xcard .g{color:var(--app);font-size:11.5px}
.ph{background:repeating-linear-gradient(45deg,#F2F3F5 0 8px,#EBEDF0 8px 16px);border-radius:10px;flex:1;display:grid;place-items:center;color:var(--faint);font-size:11px;min-height:40px;margin-top:6px}
.xtick{display:flex;align-items:center;gap:6px;border-radius:10px;background:var(--appbg);border:1px solid #D3EDD6;padding:9px 12px;font-size:12px;color:var(--ink2)}
.xtick b{color:var(--app)}
.xtabs{display:flex;align-items:baseline;gap:16px}
.xtabs b{font-size:17px}.xtabs span{font-size:17px;color:var(--faint);font-weight:600}
.xtabs .mr{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.xmk{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px}
.xmk button{flex:none;width:190px;border:0;border-radius:14px;background:var(--soft);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.xmk .xr{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}.xmk .xr div{display:flex;flex-direction:column;gap:2px}
.xmk b{font-size:14px}.xmk small{font-size:11px;color:var(--muted)}
.tbar{display:flex;justify-content:space-between;padding:2px 16px 8px;font-size:12px;font-weight:600;border-bottom:1px solid var(--line2);flex:none}
.thd{display:flex;align-items:center;gap:6px;padding:10px 16px 6px}
.thd b{font-size:18px}
.thd .tg{font-size:10.5px;color:var(--app);background:var(--appbg);padding:1px 5px;border-radius:4px}
.thd .tg.n{color:var(--muted);background:var(--soft)}
.thd .sp{margin-left:auto;color:var(--muted);letter-spacing:2px}
.tgrid{display:grid;grid-template-columns:1fr 148px;gap:10px;padding:4px 16px 12px}
.tf{display:flex;flex-direction:column;gap:7px}
.fld{height:32px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px;color:var(--muted)}
.fld.c{justify-content:center;color:var(--ink);font-weight:600}
.fld.off{background:#E4E6E9;color:var(--faint);justify-content:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg3{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:16px;padding:2px}
.seg3 span{text-align:center;padding:5px 0;border-radius:14px;font-size:12.5px;color:var(--muted)}
.seg3 .on{background:var(--app);color:#fff;font-weight:600}
.sl{display:flex;justify-content:space-between;align-items:center;height:14px;position:relative;margin:2px 2px}
.sl::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.sl i{width:9px;height:9px;border-radius:5px;border:1.5px solid #C5CBD2;background:#fff;position:relative}
.sl i:first-child{border-color:var(--app);width:13px;height:13px;border-radius:7px;border-width:2px}
.kvs{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.kvs b{color:var(--ink);font-weight:500}
.cbx{font-size:11.5px;color:var(--ink2);display:inline-flex;gap:5px;align-items:center}
.cbx::before{content:"";width:11px;height:11px;border:1.2px solid var(--muted);border-radius:2px}
.obk div{display:flex;justify-content:space-between;font-size:11px;padding:2.5px 4px}
.obk .hd{color:var(--muted);font-size:10px}
.obk .a{background:linear-gradient(to left,var(--downbg) var(--w),transparent var(--w))}
.obk .a span:first-child{color:var(--down)}
.obk .b{background:linear-gradient(to left,var(--appbg) var(--w),transparent var(--w))}
.obk .b span:first-child{color:var(--app)}
.obk .mid{display:block;padding:6px 4px}
.obk .mid b{font-size:15px;color:var(--down);display:block}
.obk .mid small{font-size:10px;color:var(--muted)}
.btabs{display:flex;gap:16px;align-items:center;padding:12px 16px 8px;border-top:8px solid var(--soft);font-size:13.5px;color:var(--muted);font-weight:600}
.btabs b{color:var(--ink)}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 16px 8px;font-size:11.5px;color:var(--muted)}
.tog{display:flex;align-items:center;gap:6px}.tog::before{content:"";width:28px;height:16px;border-radius:8px;background:#C5CBD2}
.gbtn{height:26px;border-radius:13px;border:0;background:var(--soft);font-size:11.5px;padding:0 12px;color:var(--ink2)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 0;color:var(--ink2);font-size:12.5px}
.empty i{width:54px;height:44px;border-radius:8px;background:var(--appbg);display:block}
.tp{padding-bottom:100px}
.cfr{display:flex;flex-direction:column;gap:7px;font-size:11.5px}
.cfr div{display:flex;justify-content:space-between;color:var(--muted)}
.cfr b{font-weight:500}
.cfr .note{border:1px solid var(--line);border-radius:8px;padding:7px;font-size:10.5px;line-height:1.5;color:var(--muted)}
.tmenu{position:absolute;inset:0;background:rgba(15,20,25,.35);z-index:4}
.tmenu .mc{position:absolute;left:16px;right:16px;bottom:92px;background:#fff;border-radius:16px;padding:6px 0}
.tmenu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px 20px;font-size:14px;color:var(--ink2);text-align:left}
.tmenu button i{width:20px;height:20px;border-radius:5px;background:#C9CDD2;display:block}
.tmenu button.on{color:var(--app)}.tmenu button.on i{background:var(--app)}
.tmenu button.on::after{content:"✓";margin-left:auto;font-weight:700}
.cp{padding:4px 16px 100px;display:flex;flex-direction:column;gap:14px}
.cph{display:flex;justify-content:space-between;align-items:center}
.cph>b{font-size:22px}
.gpill{border:0;background:var(--appbg);color:var(--app);border-radius:15px;height:30px;padding:0 12px;font-size:12.5px}
.eqc{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.eqc .v{font-size:26px;font-weight:700}
.g3{display:grid;grid-template-columns:repeat(3,1fr);font-size:11.5px;color:var(--muted)}
.g3 b{display:block;color:var(--ink);font-size:13px;margin-top:3px;font-weight:600}
.g3 div:nth-child(2){text-align:center}.g3 div:last-child{text-align:right}
.eqc .g3{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.chips{display:flex;gap:8px}.chips span{font-size:12px;padding:6px 12px;border-radius:15px;background:var(--soft);color:var(--muted)}.chips .on{background:#E2E5E8;color:var(--ink)}
.trd{border-bottom:1px solid var(--line2);padding-bottom:12px;display:flex;flex-direction:column;gap:5px}
.ep{padding:8px 16px 100px;display:flex;flex-direction:column;gap:12px}
.ep h6{margin:4px 0 0;font-size:12px;color:var(--muted);font-weight:500}
.ecard{border:1px solid #E1EEE3;border-radius:16px;padding:14px;background:linear-gradient(180deg,#fff,#F1FAF2)}
.ecard .v{font-size:26px;font-weight:700;margin:4px 0 12px}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 4px;border-top:1px solid var(--line);padding-top:14px}
.egrid button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.egrid i{width:24px;height:24px;border-radius:12px;border:1.6px solid var(--ink2);display:block}
.etab{display:flex;gap:16px;font-size:15px;font-weight:700;color:var(--faint)}.etab b{color:var(--ink)}
.prod{background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;width:100%}
.prod .t{display:flex;justify-content:space-between}.prod .t b{font-size:14px}
.prod .r{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px}
.pc{padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:9px}
.pc .h{display:flex;align-items:center;gap:6px}.pc .h b{font-size:15px}.pc .h .ln{margin-left:auto;color:var(--faint)}
.mine{font-size:10.5px;color:#C77C0A;background:#FFF4E0;border-radius:4px;padding:1px 6px}
.chipz{display:flex;gap:4px}.chipz span{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--ink2)}
.chipz .l{background:var(--appbg);color:var(--app)}.chipz .s{background:var(--down);color:#fff}
.pnlr{display:flex;justify-content:space-between;align-items:flex-end}.pnlr small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}.pnlr b{font-size:18px}.pnlr div:last-child{text-align:right}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px;font-size:11px;color:var(--muted)}
.pg b{display:block;color:var(--ink);font-size:13px;font-weight:500;margin-top:2px}
.pg div:nth-child(3n+2){text-align:center}.pg div:nth-child(3n){text-align:right}
.pb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pb.p2{grid-template-columns:1fr 1fr}
.pb button{height:32px;border:0;border-radius:8px;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--ink)}
.pb .g{background:var(--appbg);color:var(--app);font-weight:500}
.oc{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.prog{width:60px;height:3px;background:var(--line);border-radius:2px;display:inline-block}
.bubble .x{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:9px;border:0;background:#fff;color:var(--ink2);font-size:10px;line-height:18px;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.bubble{cursor:pointer;position:absolute;left:16px;bottom:90px;max-width:210px;background:var(--ink);color:#fff;border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:12.5px;line-height:1.45;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.18);border:0;text-align:left}
.bubble small{display:block;color:#9FE8CB;margin-top:2px}
.bubble.danger{background:#E5384F}.bubble.danger small{color:#FFE1E5}
.bubble.pending{background:#F0A81E;color:#2B1D00}.bubble.pending small{color:#5C3D00}
.orb.info .badge{background:var(--brand)}
@keyframes breath{0%,100%{transform:scale(.92)}50%{transform:scale(1)}}
@keyframes pulse{0%{transform:scale(.95);opacity:.6}100%{transform:scale(1.25);opacity:0}}
/* 合约页 */
.fh{display:flex;align-items:center;gap:8px;padding:6px 16px 10px}
.fh b{font-size:17px}
.fh .tag{font-size:11px;background:var(--soft);padding:2px 6px;border-radius:4px;color:var(--muted)}

 const dir=p.side==='多'?1:-1,upnl=dir*p.qty*(mark-p.entry),eq=margin+upnl,mm=MMR*p.qty*mark;

 return {upnl,mr:mm/eq*100,liq,dist:Math.abs(mark-liq)/mark*100};

/* ---------- 路由：用户输入 → 任务 ---------- */
function route(q){
 if(/OTC|场外|申请带单|成为带单员|当带单员/.test(q))return 'kycbiz';
 if(/冰山|TWAP|网格|拆单|跟踪委托|追踪委托/i.test(q))return 'r11';
 if(/预测|明天.*价格|会涨到|代我/.test(q))return 'predict';
 if(/人工|客服|投诉/.test(q))return 'handoff';
 if(/撤销提币|取消提币|取消这笔提币/.test(q))return 'later';
 if(/充值地址|充币地址/.test(q))return 'addr';
 // 知识类问法优先走帮助中心，避免「止盈止损怎么设」被当成设止损
 const fk=faqKey(q);if(fk&&/怎么|是什么|什么是|区别|多久|为什么|如何/.test(q)&&!/我的|我充|我提|还没|还在/.test(q))return 'faq:'+fk;
 if(/亏/.test(q)&&/撤/.test(q))return 'multi';
 if(/全买|照之前|帮我搞|梭哈/.test(q))return 'incomplete';
 if(/全部平|全平|都平/.test(q))return 'closeall';
 if(/开个|开仓|开多|开空|做多|做空/.test(q))return 'open';
 if(/^(BTC|ETH|SOL) ?合约$/.test(q))return 'open';
 if(/买/.test(q)&&/现货|BTC|ETH|SOL/.test(q))return 'spotbuy';
 if(/平仓|平了|减仓/.test(q))return 'close';
 if(/保证金/.test(q)&&/加|追加|补/.test(q))return 'margin';
 if(/撤|挂单|委托|未成交|没成交/.test(q))return 'orders';
 if(/关掉|不要了|这个/.test(q))return 'clarify';
 if(/提币|提现/.test(q))return 'withdraw';
 if(/充值|充的|到账|转进来/.test(q))return 'deposit';
 if(/跟单/.test(q))return 'copy';
 if(/宏观|美联储|CPI|事件|情绪|恐惧|贪婪|多空|美元|美债|利率/.test(q))return 'macro';
 if(/新闻|消息/.test(q))return 'news';
 if(/亏|盈亏|钱少/.test(q))return 'pnl';
 if(/SOL|止损/.test(q)&&/强平|风险|保证金率|止损|安全/.test(q))return 'risk';
 if(/强平|风险|保证金率|安全吗|还安全/.test(q))return 'overview';
 if(fk)return 'faq:'+fk;
 return 'unknown';
}

function parseTrade(q){
 const o={},lv=q.match(/(\d+)\s*(倍|x|X)/);if(lv){o.lev=+lv[1];q=q.replace(lv[0],' ')}
 if(/开多|做多|多单|(^|\s)多(\s|$)|long/i.test(q))o.side='多';else if(/开空|做空|空单|(^|\s)空(\s|$)|short/i.test(q))o.side='空';
 if(/市价/.test(q))o.type='市价';else if(/限价/.test(q))o.type='限价';
 const c=(q.match(/[A-Za-z]{2,6}/g)||[]).map(x=>x.toUpperCase()).filter(x=>!['USDT','USD','LONG','SHORT'].includes(x))[0];if(c)o.coin=c;
 const a=q.match(/(\d+(?:\.\d+)?)\s*(U|USDT)/i);if(a){o.amt=+a[1];q=q.replace(a[0],' ')}
 const n=q.match(/\d+(?:\.\d+)?/);if(n)o.num=+n[0];
 return o}
function slotAsk(f,miss,got,first,tail,pre=''){S.slot=f;
 const t=pre+(got.length?`好的，已记下：<b>${got.join(' · ')}</b>。`:'')+(miss.length===1?`还需要你说明<b>${miss[0]}</b>？`:`还需要你说明：${miss.map(x=>'<b>'+x+'</b>').join('、')}。`)+(first&&!got.length?tail:'');
 return reply('核对参数',()=>[{r:'a',k:'text',d:{trace:`还缺 ${miss.length} 个参数`,t}}])}

function done(d,ok=()=>{},res=S.res){d.st='sub';render();setTimeout(()=>{
 if(res==='fail'){d.st='fail';return render()}
 if(res==='unknown'){d.st='unknown';render();return setTimeout(()=>{ok();d.st='done';toast('已查询到结果：提交成功');render()},2200)}
 ok();d.st='done';render()},900)}
function act(i,a,v){
 const m=S.msgs[i],d=m&&m.d;if(!m)return;
 if(a==='fu'){if(S.busy)return toast('请等当前回答完成');const[t,x]=[v.split(':')[0],v.slice(v.indexOf(':')+1)];
  if(t==='q')return ask(x);if(t==='go'){tok++;S.busy=false;S.ai=null;S.page=x;S.scene=TAB[x]==='trade'?'futures':'home';return render()}if(t==='toast')return toast(x);
 }
 if(a==='refresh'){if(m.k==='risk'){d.mark=+((d.mark||POS[d.pos].mark)+0.5).toFixed(2);d.at='10:43:05';toast('已刷新')}else toast('已刷新');return render()}
 if(a==='retryq'){if(S.busy)return;const q=d.q;S.msgs.splice(i-1,2);return ask(q)}
 if(a==='retry'){d.st=m.k==='spot'?'edit':'edit';return render()}
 if(a==='cancel'&&['stop','close','margin','open','sbuy'].includes(m.k)){S.msgs.splice(i,1);S.msgs.push({r:'a',k:'text',d:{t:'已取消，没有提交任何操作。'}});return render()}
 if(m.k==='risk'){
  if(a==='sl'){S.msgs.push({r:'u',t:'设止损'});return reply('计算候选止损价',()=>[{r:'a',k:'stop',d:{pos:d.pos,p:null,st:'edit'}}])}
  if(a==='reduce'){S.msgs.push({r:'u',t:'减仓'});return reply('生成平仓卡片',()=>[{r:'a',k:'close',d:{pos:d.pos,pct:50,type:'市价',st:'edit'}}])}
  if(a==='margin'){S.msgs.push({r:'u',t:'加保证金'});return POS[d.pos].mode==='全仓'?reply('读取仓位',()=>crossNote()):reply('计算追加后的保证金率',()=>[{r:'a',k:'margin',d:{pos:d.pos,add:50,st:'edit'}}])}
 }
 if(m.k==='stop'){if(a==='pickp')d.p=v;if(a==='confirm'&&d.p&&d.st==='edit'){return done(d,()=>{POS[d.pos].tpsl=POS[d.pos].tpsl||'止损'})}return render()}
 if(m.k==='margin'){if(a==='add')d.add=v;if(a==='confirm'&&d.st==='edit'&&d.add<=BAL.fut){return done(d,()=>{const p=POS[d.pos],a0=calc(p);p.margin+=d.add;BAL.fut-=d.add;const a1=calc(p);d.from=[a0.mr,a1.mr,a0.liq,a1.liq]})}return render()}
 if(m.k==='open'&&a==='confirm'&&d.st==='edit'&&d.amt<=BAL.fut&&d.type==='限价')return done(d,()=>{BAL.fut-=d.amt;ORDERS.push({id:'o'+(ORDERS.length+1),sym:d.coin+'USDT',type:'限价',side:'开'+d.side,price:fp(d.price),qty:+(d.amt*d.lev/d.price).toFixed(5),unit:d.coin,filled:0})});
 if(m.k==='open'&&a==='confirm'&&d.st==='edit'&&d.amt<=BAL.fut)return done(d,()=>{const px=PX[d.coin],k=d.coin.toLowerCase(),q=d.amt*d.lev/px,o=POS[k];BAL.fut-=d.amt;
  if(o&&!o.closed&&o.side===d.side){o.entry=(o.entry*o.qty+px*q)/(o.qty+q);o.qty=+(o.qty+q).toFixed(5);o.margin+=d.amt}
  else POS[k]={sym:d.coin+'USDT',side:d.side,lev:d.lev,mode:'全仓',qty:+q.toFixed(5),unit:d.coin,entry:px,mark:px,margin:d.amt,tpsl:null};
  if(S.acct==='nopos')S.acct='pos'});
 if(m.k==='sbuy'&&a==='confirm'&&d.st==='edit'&&d.amt<=BAL.spot)return done(d,()=>{BAL.spot-=d.amt;if(d.type==='限价')SPOT.push({id:'s'+(SPOT.length+1),sym:d.coin+'/USDT',type:'限价',side:'买入',price:f2(d.price),qty:+(d.amt/d.price).toFixed(6),unit:d.coin})});
 if(m.k==='pick'&&a==='pick'){if(S.busy||d.sel)return;d.sel=v;S.msgs.push({r:'u',t:'平 '+POS[v].sym+' '+POS[v].side+'单'});return reply('生成平仓卡片',()=>[{r:'a',k:'close',d:{pos:v,pct:d.pct||100,type:'市价',st:'edit'}}])}
 if(m.k==='close'){
  const p=POS[d.pos];
  if(a==='pct')d.pct=v;if(a==='type')d.type=v;
  if(a==='reload'){p.qty=+(p.qty/2).toFixed(4);p.margin/=2;S.res='ok';d.st='edit';d.pct=100;toast('已按最新仓位刷新')}
  if(a==='confirm'){if(d.st!=='edit'||p.closed)return;d.st='sub';render();
   const settle=()=>{d.qty=+(p.qty*d.pct/100).toFixed(4);d.pnl=calc(p).upnl*d.pct/100;if(d.pct===100)p.closed=true;else{p.margin*=1-d.pct/100;p.qty=+(p.qty-d.qty).toFixed(4)}if(!openPos().length&&S.acct==='pos')S.acct='nopos';d.st='done'};
   return setTimeout(()=>{
    if(S.res==='ok')settle();
    else if(S.res==='fail'){d.st='fail'}
    else if(S.res==='changed'){d.st='invalid'}
    else{d.st='unknown';render();return setTimeout(()=>{settle();toast('已查询到结果：平仓成功');render()},2200)}
    render()},900)}
  return render()}
 if(m.k==='orders'){
  if(a==='filter'){d.f=v;d.sel=d.sel.filter(id=>v==='全部'||ORDERS.find(o=>o.id===id).sym===v)}
  if(a==='tog'){d.sel=d.sel.includes(v)?d.sel.filter(x=>x!==v):[...d.sel,v]}
  if(a==='all'&&d.f!=='全部'){const ids=liveOrd().filter(o=>o.sym===d.f).map(o=>o.id);d.sel=ids.every(x=>d.sel.includes(x))?[]:ids}
  if(a==='ask')d.st='confirm';
  if(a==='back')d.st='edit';
  // 批量撤单的失败按「部分失败」展示：失败的那笔已全部成交，其余照常撤销
  if(a==='do'){d.failId=S.res==='fail'?d.sel[0]:null;return done(d,()=>{ORDERS.forEach(o=>{if(d.sel.includes(o.id))o.done=true})},S.res==='fail'?'ok':S.res)}
  return render()}
 if(m.k==='spot'){if(a==='ask')d.st='confirm';if(a==='back')d.st='edit';if(a==='do')return done(d,()=>{SPOT.forEach(o=>o.done=true)});return render()}
 if(m.k==='otype'&&a==='otype'){if(S.busy||d.sel)return;d.sel=v;return ask((/撤|不要/.test(d.q)?'撤掉':'看')+(/BTC/.test(d.q)?' BTC ':'')+v+'挂单')}
 if(m.k==='macro'&&a==='hyp'){d.h=v;return render()}
 if(m.k==='faq'&&a==='faq'){d.t=v;return render()}
 if(m.k==='handoff'&&a==='send'){d.st='done';return render()}
}

 ${dm.includes('user')?`<div class="row"><label>用户身份</label>${segBtns('user',[['normal','正常（已认证）'],['unkyc','未 KYC']])}</div>`:''}
