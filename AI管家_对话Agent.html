<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 管家 · 对话 Agent 原型</title>
<style>
:root{
 --ink:#0F1419;--ink2:#2B3139;--muted:#6B7480;--faint:#9AA3AE;--line:#E6E8EB;--line2:#F0F1F3;
 --bg:#EEF0F2;--panel:#FFFFFF;--soft:#F5F6F7;
 --up:#0B9B5C;--upbg:#E7F6EE;--down:#D9304F;--downbg:#FCEBEE;--warn:#C27C0E;--warnbg:#FDF4E3;
 --brand:#0F7B5F;--brandbg:#E6F4EF;--ai1:#19C08A;--ai2:#0E9F9A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:var(--ink);background:var(--bg);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr 340px;height:100vh}
/* 左侧旅程导航 */
aside.nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 18px 12px}
.brand b{font-size:15px;display:block}
.brand span{font-size:11.5px;color:var(--muted)}
.navlist{overflow-y:auto;padding:0 10px 20px;flex:1}
.navlist h4{font-size:11.5px;font-weight:600;color:var(--muted);margin:14px 8px 4px}
.navlist button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;font-size:13px;padding:7px 8px;border-radius:8px}
.navlist button:hover{background:var(--soft)}
.navlist button[aria-current=true]{background:var(--brandbg);color:var(--brand);font-weight:600}
.navlist .new{font-size:10px;color:var(--brand);border:1px solid #BFE3D6;border-radius:4px;padding:0 4px;margin-left:auto;font-weight:500}
.mbar{display:none}
/* 中间舞台 */
main{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:18px 16px;overflow:auto;min-width:0}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px;align-self:stretch;text-align:center}
.crumb b{color:var(--ink)}
.device{width:390px;height:800px;border-radius:44px;background:#0F1419;padding:9px;box-shadow:0 24px 50px rgba(15,20,25,.18);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff}
/* 右侧说明栏 */
aside.notes{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px}
.notes h2{font-size:15px;margin:2px 0 2px}
.notes .jr{font-size:11.5px;color:var(--muted)}
.notes h5{font-size:11.5px;color:var(--muted);font-weight:600;margin:16px 0 6px;letter-spacing:.2px}
.notes p,.notes li{font-size:12.5px;line-height:1.6;color:var(--ink2);margin:0}
.notes ol,.notes ul{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:3px}
.chipsr{display:flex;flex-wrap:wrap;gap:6px}
.rtag{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--brandbg);color:var(--brand)}
.qtag{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--warnbg);color:var(--warn)}
.demo{margin-top:16px;padding:12px;border-radius:10px;background:var(--soft)}
.demo h5{margin-top:0}
.seg{display:inline-flex;background:#E9EBEE;border-radius:8px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;font-size:12px;padding:5px 9px;border-radius:6px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.demo .row{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.demo .row:last-child{margin-bottom:0}
.demo label{font-size:11.5px;color:var(--muted)}
.replay{margin-top:12px;width:100%;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px}

/* ===== 手机内部 ===== */
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;flex:none}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scroll{flex:1;overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar{width:0}
.hp{padding:4px 16px 100px;display:flex;flex-direction:column;gap:16px}
.hp .top{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:16px;background:#EEF1F4;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.search{flex:1;height:34px;border-radius:17px;background:var(--soft);display:flex;align-items:center;padding:0 14px;color:var(--faint);font-size:12.5px}
.asset small{font-size:12px;color:var(--muted)}
.asset .v{font-size:28px;font-weight:700;margin:2px 0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiles div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.tiles i{width:40px;height:40px;border-radius:12px;background:var(--soft);display:block;position:relative}
.tiles i::after{content:"";position:absolute;inset:13px;border-radius:4px;border:2px solid #C5CBD2}
.mkt{display:flex;flex-direction:column}
.mkt .h{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}
.mkt .h b{color:var(--ink)}
.mrow{display:grid;grid-template-columns:1fr auto 72px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);gap:10px}
.mrow b{font-size:14px}
.pill{font-size:12px;font-weight:600;padding:5px 0;border-radius:6px;text-align:center;color:#fff}
.pill.up{background:var(--up)}.pill.down{background:var(--down)}
/* 底部悬浮导航：左侧 AI 入口独立成圆，右侧胶囊 tab */
.tabnav{position:absolute;left:10px;right:10px;bottom:16px;display:flex;align-items:center;gap:8px;z-index:5}
.navbar{flex:1;min-width:0;height:60px;border-radius:30px;background:rgba(255,255,255,.97);box-shadow:0 6px 20px rgba(15,20,25,.12);display:flex;align-items:center;padding:0 4px}
.navbar button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--ink2);padding:0;white-space:nowrap}
.navbar .ic{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--ink2);display:grid;place-items:center;font-size:11px;line-height:1}
.navbar .on .ic{width:42px;height:42px;border-radius:21px;background:var(--ink);border:0;color:#fff;font-size:17px}
.navbar .on .l{display:none}
.homebar{position:absolute;left:50%;bottom:5px;width:120px;height:4px;border-radius:2px;background:#C9CED4;transform:translateX(-50%);z-index:5}
.orb{position:relative;flex:none;width:60px;height:60px;border-radius:30px;background:#fff;box-shadow:0 6px 18px rgba(15,20,25,.16);display:grid;place-items:center;border:0;padding:0}
.orb i{width:38px;height:38px;border-radius:19px;display:block;margin-top:-6px;background:radial-gradient(circle at 35% 30%,#8CF0C8,var(--ai1) 45%,var(--ai2));animation:breath 3.2s ease-in-out infinite}
.orb em{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--ink);border-radius:6px;padding:0 5px;line-height:14px}
.orb.pending i{background:radial-gradient(circle at 35% 30%,#FFE08A,#F0A81E 50%,#C77C0A)}
.orb.danger i{background:radial-gradient(circle at 35% 30%,#FF9AA8,#E5384F 50%,#B01F37)}
.orb.pending::after,.orb.danger::after{content:"";position:absolute;inset:-4px;border-radius:35px;border:2px solid;opacity:.5;animation:pulse 1.8s ease-out infinite}
.orb.pending::after{border-color:#F0A81E}.orb.danger::after{border-color:#E5384F}
.orb .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--down);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.orb.pending .badge{background:#E08B00}
.bubble{position:absolute;left:16px;bottom:90px;max-width:210px;background:var(--ink);color:#fff;border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:12.5px;line-height:1.45;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.18);border:0;text-align:left}
.bubble small{display:block;color:#9FE8CB;margin-top:2px}
.bubble.danger{background:#E5384F}.bubble.danger small{color:#FFE1E5}
.bubble.pending{background:#F0A81E;color:#2B1D00}.bubble.pending small{color:#5C3D00}
.orb.info .badge{background:var(--brand)}
@keyframes breath{0%,100%{transform:scale(.92)}50%{transform:scale(1)}}
@keyframes pulse{0%{transform:scale(.95);opacity:.6}100%{transform:scale(1.25);opacity:0}}
/* 合约页 */
.fh{display:flex;align-items:center;gap:8px;padding:6px 16px 10px}
.fh b{font-size:17px}
.fh .tag{font-size:11px;background:var(--soft);padding:2px 6px;border-radius:4px;color:var(--muted)}
.aibtn{margin-left:auto;height:30px;border-radius:15px;border:1px solid #BFE3D6;background:var(--brandbg);color:var(--brand);font-size:12px;font-weight:600;padding:0 10px;display:flex;align-items:center;gap:6px}
.aibtn i{width:14px;height:14px;border-radius:7px;background:radial-gradient(circle at 35% 30%,#8CF0C8,var(--ai1) 45%,var(--ai2))}
.fp{padding:0 16px}
.fp .p{font-size:26px;font-weight:700;color:var(--up)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
.ob div{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.form{display:flex;flex-direction:column;gap:8px}
.form .f{height:34px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px;color:var(--muted)}
.form .bb{height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px}
.ptab{display:flex;gap:16px;padding:10px 16px 0;border-top:6px solid var(--soft);font-size:13px;color:var(--muted)}
.ptab b{color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:6px}
.prow{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
/* 锁屏 */
.lock{position:absolute;inset:0;background:linear-gradient(180deg,#1F3B37,#0D1A21);color:#fff;display:flex;flex-direction:column;align-items:center}
.lock .d{margin-top:60px;font-size:15px;opacity:.85}
.lock .t{font-size:72px;font-weight:300;letter-spacing:-2px;line-height:1.1}
.push{width:calc(100% - 24px);background:rgba(255,255,255,.9);color:var(--ink);border-radius:18px;padding:11px 13px;margin-top:10px;text-align:left;border:0;display:flex;gap:10px}
.push:first-of-type{margin-top:40px}
.push .ic{width:34px;height:34px;border-radius:9px;background:var(--ink);flex:none;display:grid;place-items:center}
.push .ic i{width:16px;height:16px;border-radius:8px;background:radial-gradient(circle at 35% 30%,#8CF0C8,var(--ai1) 45%,var(--ai2))}
.push b{font-size:13.5px}.push p{margin:2px 0 0;font-size:12.5px;line-height:1.4;color:var(--ink2)}
.push .tm{margin-left:auto;font-size:11px;color:var(--muted);flex:none}
.push.hot{box-shadow:0 0 0 2px #F0A81E}
.lock .tip{position:absolute;bottom:36px;font-size:12px;opacity:.6}

/* ===== AI 浮层 ===== */
.scrim{position:absolute;inset:0;background:rgba(15,20,25,.38);z-index:10}
.ai{position:absolute;left:0;right:0;bottom:0;top:22%;background:#fff;border-radius:22px 22px 0 0;z-index:11;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.12);transition:top .25s}
.ai.full{top:0;border-radius:0}
.ai.full .sbpad{display:block}
.sbpad{display:none;height:44px;flex:none}
.grab{width:36px;height:4px;border-radius:2px;background:#D6DADF;margin:8px auto 0;flex:none}
.ai.full .grab{display:none}
.ahead{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 14px;flex:none}
.ahead .ttl{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.ahead .ttl i{width:18px;height:18px;border-radius:9px;background:radial-gradient(circle at 35% 30%,#8CF0C8,var(--ai1) 45%,var(--ai2))}
.atabs{display:flex;background:var(--soft);border-radius:9px;padding:2px;margin-left:10px}
.atabs button{border:0;background:none;font-size:12.5px;padding:4px 12px;border-radius:7px;color:var(--muted)}
.atabs button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ib{width:30px;height:30px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:15px}
.ib:hover{background:var(--soft)}
.ahead .sp{flex:1}
.ctxbar{margin:0 14px 6px;padding:7px 10px;border-radius:8px;background:var(--soft);font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex:none}
.ctxbar b{color:var(--ink)}
.from{margin:0 14px 6px;padding:8px 10px;border-radius:8px;background:var(--brandbg);font-size:11.5px;color:var(--brand);flex:none;line-height:1.45}
.abody{flex:1;overflow-y:auto;min-height:0;padding:6px 14px 12px;display:flex;flex-direction:column;gap:12px}
.abody::-webkit-scrollbar{width:0}
.composer{flex:none;border-top:1px solid var(--line2);padding:8px 12px 12px;background:#fff}
.sugg{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.sugg::-webkit-scrollbar{height:0}
.sugg button{flex:none;border:1px solid var(--line);background:#fff;border-radius:15px;font-size:12px;padding:5px 10px;color:var(--ink2)}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input{flex:1;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--soft);padding:0 14px;font:inherit;font-size:13px;outline:none}
.inrow input:focus{border-color:#9DD5C2;background:#fff}
.send{width:38px;height:38px;border-radius:19px;border:0;background:var(--ink);color:#fff;font-size:16px}
.send:disabled{background:#C9CED4}
.disc{font-size:10.5px;color:var(--faint);text-align:center;margin-top:6px}

/* 看板 */
.greet{font-size:12px;color:var(--muted)}
.hero{border-radius:14px;padding:14px;background:var(--warnbg);display:flex;flex-direction:column;gap:6px}
.hero .st{font-size:11.5px;font-weight:600;color:var(--warn)}
.hero b{font-size:17px;line-height:1.35}
.hero .acts{display:flex;gap:8px;margin-top:4px}
.btn{height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;padding:0 12px}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dan{background:var(--down);color:#fff;border-color:var(--down)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sec{display:flex;flex-direction:column;gap:2px}
.sec h6{font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:600;display:flex;justify-content:space-between}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);border-left:0;border-right:0;border-top:0;background:none;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .k{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;flex:none}
.k.w{background:var(--warnbg);color:var(--warn)}.k.g{background:var(--upbg);color:var(--up)}.k.n{background:var(--soft);color:var(--muted)}.k.r{background:var(--downbg);color:var(--down)}
.li .tx{flex:1;font-size:13px;line-height:1.4}
.li .ar{color:var(--faint)}
.boxs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;background:#fff}
.box small{font-size:11px;color:var(--muted)}
.box b{display:block;font-size:17px;margin-top:2px}

/* 消息 */
.mu{align-self:flex-end;max-width:80%;background:var(--ink);color:#fff;padding:9px 12px;border-radius:14px 14px 4px 14px;font-size:13.5px;line-height:1.45}
.ma{display:flex;flex-direction:column;gap:8px;max-width:100%}
.trace{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.trace .dot{width:6px;height:6px;border-radius:3px;background:var(--ai1);animation:breath 1s infinite}
.trace.done::before{content:"✓";color:var(--up);font-weight:700}
.at{font-size:13.5px;line-height:1.6;color:var(--ink)}
.at b{font-weight:600}
.fu{display:flex;flex-wrap:wrap;gap:6px}
.fu button{border:1px solid #BFE3D6;background:var(--brandbg);color:var(--brand);border-radius:14px;font-size:12px;padding:4px 10px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fff}
.ch{display:flex;align-items:center;gap:6px}
.ch b{font-size:14px}
.ch .tag{font-size:11px;color:var(--muted);background:var(--soft);padding:2px 6px;border-radius:4px}
.ch .r{margin-left:auto;font-size:11.5px;font-weight:600}
.big{font-size:28px;font-weight:700;line-height:1.1}
.sub{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv small{font-size:11px;color:var(--muted)}
.kv b{font-size:13.5px}
.rows{display:flex;flex-direction:column}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line2);gap:10px}
.rw:last-child{border-bottom:0}
.rw span{color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1}
.stamp{font-size:11px;color:var(--faint);display:flex;justify-content:space-between;align-items:center}
.stamp button{border:0;background:none;color:var(--brand);font-size:11px;padding:0}
.meter{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--down) 0 20%,#F0A81E 20% 45%,var(--up) 45%);position:relative}
.meter i{position:absolute;top:-4px;width:3px;height:14px;background:var(--ink);border-radius:2px}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}
.opt{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;width:100%}
.opt[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .rad{width:16px;height:16px;border-radius:8px;border:1.5px solid #C5CBD2;flex:none}
.opt[aria-pressed=true] .rad{border:5px solid var(--ink)}
.opt .grow{flex:1;display:flex;flex-direction:column;gap:2px}
.opt .grow b{font-size:13px}.opt .grow small{font-size:11.5px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid #C5CBD2;flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.opt[aria-pressed=true] .chk{background:var(--ink);border-color:var(--ink)}
.banner{border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.5}
.banner.w{background:var(--warnbg);color:#8A5A0B}
.banner.g{background:var(--upbg);color:#0A6B41}
.banner.r{background:var(--downbg);color:#A3203A}
.banner.n{background:var(--soft);color:var(--ink2)}
.pend{font-size:10.5px;color:var(--warn);background:var(--warnbg);border-radius:4px;padding:1px 5px;font-weight:600;white-space:nowrap}
.tl{display:flex;flex-direction:column;gap:0}
.tl div{display:flex;gap:10px;font-size:12.5px;position:relative;padding-bottom:12px}
.tl div::before{content:"";width:10px;height:10px;border-radius:5px;background:#D6DADF;flex:none;margin-top:3px;z-index:1}
.tl div::after{content:"";position:absolute;left:4px;top:13px;bottom:0;width:2px;background:#E6E8EB}
.tl div:last-child::after{display:none}
.tl div.ok::before{background:var(--up)}
.tl div.cur::before{background:#F0A81E;box-shadow:0 0 0 4px var(--warnbg)}
.tl span{color:var(--muted);margin-left:auto}
.bar{display:grid;grid-template-columns:86px 1fr 62px;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.bar .tr{height:8px;background:var(--soft);border-radius:4px;position:relative}
.bar .tr i{position:absolute;top:0;bottom:0;border-radius:4px}
.bar b{text-align:right}

function route(q){
 if(/预测|明天.*价格|会涨到|带单|代我/.test(q))return 'unsupported';
 if(/人工|客服|投诉/.test(q))return 'handoff';
 if(/亏/.test(q)&&/撤/.test(q))return 'multi';
 if(/关掉|不要了|这个/.test(q))return 'clarify';
 if(/全买|照之前|帮我搞|梭哈/.test(q))return 'incomplete';
 if(/开个|开仓|开多|开空/.test(q))return 'open';
 if(/平仓|平了|减仓/.test(q))return 'close';
 if(/撤|挂单|委托|未成交/.test(q))return 'orders';
 if(/提币|提现/.test(q))return 'withdraw';
 if(/充值|充的|到账/.test(q))return 'deposit';
 if(/宏观|美联储|CPI|事件|情绪|恐惧|贪婪|多空|美元|美债|利率/.test(q))return 'macro';
 if(/新闻|消息/.test(q))return 'news';
 if(/亏|盈亏|钱少/.test(q))return 'pnl';
 if(/强平|风险|保证金率|止损/.test(q))return 'risk';
 for(const k of FAQ_KEYS){const kw={fee:/手续费/,funding:/资金费/,mode:/全仓|逐仓/,avail:/开不了|不能开/,tpsl:/止盈/,order:/市价|限价/,slip:/滑点|成交价/,safe:/安全|诈骗|骗/,redeem:/赎回|理财/,transfer:/划转/,deposit:/没到/,pnl:/浮盈|已实现/}[k];if(kw.test(q))return 'faq:'+k}
 return 'unsupported';
}

 if(S.ctx)return ['我的 BTC 挂单','BTC 相关新闻','我要平仓','资金费率是什么？'];
 return ['我要平仓','查我所有的合约挂单','提币一直处理中怎么办？','今天有哪些宏观事件？','把这个关掉'];
}
function aiPanel(){
 const chat=S.tab==='chat';
 return `<section class="ai full"><div class="sbpad"></div><div class="grab"></div>
 <div class="ahead"><span class="ttl"><i></i>AI 管家</span><div class="atabs"><button aria-pressed="${!chat}" onclick="S.tab='board';render()">看板</button><button aria-pressed="${chat}" onclick="S.tab='chat';render()">对话</button></div><span class="sp"></span>
 <button class="ib" title="新对话" onclick="tok++;S.msgs=[];S.busy=false;S.from=null;S.tab='chat';render()">＋</button><button class="ib" title="关闭" onclick="closeAI()">✕</button></div>
 ${chat&&S.ctx?`<div class="ctxbar">当前页面：<b>${S.ctx}</b><span>· 只作为参考，不代表下单授权</span></div>`:''}
 ${chat&&S.from?`<div class="from">${S.from}</div>`:''}
 <div class="abody" id="abody">${chat?(S.msgs.length?S.msgs.map((m,i)=>m.r==='u'?`<div class="mu">${m.t}</div>`:R[m.k](m.d,i)).join(''):`<div class="ma"><div class="at">${S.ctx?`你在看 <b>${S.ctx}</b>，想问点什么？行情、你的仓位和挂单、规则都可以。`:'有什么想问的？查账户、看行情、准备交易都可以。'}</div></div>`):board()}</div>
 <div class="composer">${chat?`<div class="sugg">${sugg().map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}</div>`:''}
 <form class="inrow" onsubmit="event.preventDefault();const v=this.q.value;this.q.value='';ask(v)"><input name="q" placeholder="问我任何事，例如：我的 SOL 还安全吗" autocomplete="off" maxlength="300"><button class="send" ${S.busy?'disabled':''} aria-label="发送">↑</button></form>
 <div class="disc">AI 可能出错。涉及资金的操作，以确认卡片和业务回执为准。</div></div></section>`}
function render(){
 const prev=$('abody'),atBottom=prev?prev.scrollHeight-prev.scrollTop-prev.clientHeight<40:true,keep=prev?prev.scrollTop:0;
 const input=document.querySelector('.inrow input'),val=input?input.value:'',foc=document.activeElement===input;
 $('screen').innerHTML=(S.page==='lock'?lock():S.page==='futures'?futures():home())+(S.ai?aiPanel():'')+(S.toast?`<div class="toast">${S.toast}</div>`:'');
 const b=$('abody');if(b){b.scrollTop=(stickBottom||atBottom)?b.scrollHeight:keep}stickBottom=false;
 const ni=document.querySelector('.inrow input');if(ni){ni.value=val;if(foc)ni.focus()}
 renderSide();
}
function openAI(ctx){S.ai='full';S.ctx=ctx||(S.page==='futures'?'BTCUSDT 永续':null);S.tab=S.ctx?'chat':'board';S.bubble=false;render()}
function closeAI(){tok++;S.busy=false;S.ai=null;render()}
function toast(t){S.toast=t;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast='';render()},1600)}

/* ---------- 导航与说明栏 ---------- */
function go(id){const sc=SCENES.find(s=>s.id===id);if(!sc)return;if(S.scene==='comply'&&id!=='comply')S.user='normal';S.scene=id;reset();sc.run();stickBottom=true;render()}
function renderNav(){
 const groups=[...new Set(SCENES.map(s=>s.g))];
 $('nav').innerHTML=groups.map(g=>`<h4>${g}</h4>`+SCENES.filter(s=>s.g===g).map(s=>`<button aria-current="${S.scene===s.id}" onclick="go('${s.id}')">${s.t}${s.new?'<span class="new">新增</span>':''}</button>`).join('')).join('');
 $('msel').innerHTML=groups.map(g=>`<optgroup label="${g}">`+SCENES.filter(s=>s.g===g).map(s=>`<option value="${s.id}" ${S.scene===s.id?'selected':''}>${s.t}</option>`).join('')+'</optgroup>').join('');
}
function segBtns(key,opts){return `<div class="seg">${opts.map(([v,l])=>`<button aria-pressed="${S[key]===v}" onclick="setDemo('${key}','${v}')">${l}</button>`).join('')}</div>`}
function setDemo(k,v){S[k]=v;if(k==='ordersEmpty')S[k]=v==='true';if(k==='orb'){S.bubble=true;S.ai=null;S.page='home';render();return}go(S.scene)}
function renderSide(){
 const sc=SCENES.find(s=>s.id===S.scene);
 $('crumb').innerHTML=`${sc.g} · <b>${sc.t}</b>`;
 renderNav();
 const dm=sc.demo||[];
 $('notes').innerHTML=`<div class="jr">${sc.g}</div><h2>${sc.t}</h2>
 <h5>触发条件</h5><p>${sc.trig}</p>
 <h5>处理逻辑</h5><ol>${sc.logic.map(x=>`<li>${x}</li>`).join('')}</ol>
 <h5>边界与兜底</h5><ul>${sc.edge.map(x=>`<li>${x}</li>`).join('')}</ul>
 <h5>关联规则（台账）</h5><div class="chipsr">${sc.rules.map(r=>`<span class="rtag">${r}</span>`).join('')||'<span class="sub">—</span>'}</div>
 ${sc.pend.length?`<h5>⚠️ 待确认</h5><div class="chipsr">${sc.pend.map(q=>`<span class="qtag">${q}</span>`).join('')}</div>`:''}
 <div class="demo"><h5>演示开关</h5>
 ${dm.includes('orb')?`<div class="row"><label>入口状态</label>${segBtns('orb',[['default','默认'],['info','资讯'],['pending','待处理'],['danger','高风险']])}</div>`:''}
 ${dm.includes('close')?`<div class="row"><label>平仓提交结果</label>${segBtns('closeRes',[['ok','成功'],['unknown','结果未知'],['changed','仓位已变化']])}</div>`:''}
 ${dm.includes('orders')?`<div class="row"><label>挂单数据</label><div class="seg"><button aria-pressed="${!S.ordersEmpty}" onclick="setDemo('ordersEmpty','false')">有挂单</button><button aria-pressed="${S.ordersEmpty}" onclick="setDemo('ordersEmpty','true')">空状态</button></div></div>`:''}
 <div class="row"><label>用户身份（全局）</label>${segBtns('user',[['normal','正常'],['unkyc','未 KYC'],['restricted','受限地区']])}</div>
 <button class="replay" onclick="go(S.scene)">↺ 重播本场景</button></div>
 <h5>说明</h5><p class="sub" style="font-size:11.5px;line-height:1.6">所有数据为示意，不连接账户、行情或模型。对话框也可以自由输入，系统按关键词匹配到对应任务；匹配不到时走「暂不支持」。</p>`;
}
$('msel').onchange=e=>go(e.target.value);
function fit(){const w=window.innerWidth;const s=w<=760?Math.min(1,(w-16)/408):1;document.querySelector('.device').style.setProperty('--s',s);$('wrapdev').style.height=w<=760?(818*s)+'px':''}
window.addEventListener('resize',fit);fit();
go('home');
</script>
</body>
</html>
