<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>合约K线快捷下单 - 交互原型</title>
<style>
  :root{
    --bg:#0b0e11; --panel:#151a21; --panel2:#1c232d; --border:#252c36;
    --txt:#eaecef; --sub:#848e9c; --sub2:#5e6673;
    --green:#0ecb81; --red:#f6465d; --yellow:#f0b90b; --orange:#f6a623;
    --green-bg:rgba(14,203,129,.12); --red-bg:rgba(246,70,93,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#000;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--txt);display:flex;justify-content:center;min-height:100vh}
  .num{font-variant-numeric:tabular-nums}
  .phone{width:400px;max-width:100vw;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}

  /* ---------- 头部 ---------- */
  .hd{padding:10px 12px 8px;border-bottom:1px solid var(--border)}
  .hd-row1{display:flex;align-items:center;gap:8px}
  .hd-sym{font-size:17px;font-weight:700}
  .hd-tag{font-size:10px;color:var(--sub);border:1px solid var(--border);border-radius:3px;padding:1px 4px}
  .chip{font-size:11px;background:var(--panel2);border-radius:4px;padding:3px 7px;color:var(--yellow);font-weight:600;cursor:pointer}
  .chip.mode{color:var(--txt)}
  .hd-right{margin-left:auto;display:flex;gap:6px;align-items:center}
  .icon-btn{width:28px;height:28px;border-radius:6px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:var(--sub)}
  .icon-btn.on{color:var(--yellow);box-shadow:inset 0 0 0 1px var(--yellow)}
  .hd-row2{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
  .hd-price{font-size:22px;font-weight:700}
  .hd-price.up{color:var(--green)} .hd-price.down{color:var(--red)}
  .hd-sub{font-size:10px;color:var(--sub);line-height:1.5}
  .hd-sub b{color:var(--txt);font-weight:500}
  .flash-up{animation:fu .35s} .flash-down{animation:fd .35s}
  @keyframes fu{0%{background:var(--green-bg)}100%{background:transparent}}
  @keyframes fd{0%{background:var(--red-bg)}100%{background:transparent}}

  /* ---------- 周期栏 ---------- */
  .tf{display:flex;align-items:center;padding:6px 12px;gap:14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--sub)}
  .tf span{cursor:pointer;padding:2px 0}
  .tf span.on{color:var(--yellow);font-weight:600;border-bottom:2px solid var(--yellow)}
  .tf .sp{margin-left:auto;display:flex;gap:12px;color:var(--sub)}

  /* ---------- 图表 ---------- */
  .chart-wrap{position:relative;height:340px;background:var(--bg);touch-action:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  #legend{position:absolute;top:4px;left:8px;font-size:10px;color:var(--sub);pointer-events:none;line-height:1.6;z-index:15}
  #legend b{color:var(--txt);font-weight:500}
  /* 十字光标K线信息卡 */
  #legend .xcard{margin-top:4px;background:rgba(28,35,45,.96);border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:152px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  #legend .xr{display:flex;justify-content:space-between;gap:12px;line-height:1.75}
  #legend .xr span{color:var(--sub)}
  #legend .xr b{font-weight:600}
  #legend .xr.fillr{border-top:1px dashed var(--border);margin-top:4px;padding-top:4px}

  /* 快捷下单：价格轴悬浮 + 号标签 */
  #quickPill{position:absolute;right:2px;transform:translateY(-50%);z-index:25;display:flex;align-items:stretch;background:#17181c;border:1px solid #2a3139;border-radius:9px;overflow:hidden;cursor:grab;box-shadow:0 3px 12px rgba(0,0,0,.55);touch-action:none;user-select:none}
  #quickPill:active{cursor:grabbing}
  #quickPill .qp-plus{width:34px;display:flex;align-items:center;justify-content:center;border-right:1px solid #3a424d;cursor:pointer;flex:none}
  #quickPill .qp-plus i{width:20px;height:20px;border-radius:50%;background:#fff;color:#17181c;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-style:normal;line-height:1}
  #quickPill .qp-plus:active i{transform:scale(.9)}
  #quickPill .qp-info{display:flex;flex-direction:column;justify-content:center;line-height:1.25;text-align:right;padding:4px 9px}
  #qpPrice{font-size:11px;font-weight:700;color:#fff}
  #qpPct{font-size:9px}

  /* 底部做多/做空栏 */
  .bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:400px;max-width:100vw;background:rgba(11,14,17,.96);backdrop-filter:blur(6px);border-top:1px solid var(--border);padding:8px 12px calc(10px + env(safe-area-inset-bottom));z-index:50}
  .lsbar{display:flex;align-items:center;gap:8px;font-size:10px;margin-bottom:8px}
  .ls-l{color:var(--green)} .ls-r{color:var(--red)}
  .ls-track{flex:1;height:4px;border-radius:2px;background:var(--red);overflow:hidden}
  .ls-fill{width:67.5%;height:100%;background:var(--green);border-radius:2px 0 0 2px}
  .bbar-btns{display:flex;gap:10px}
  .bbar-btns button{flex:1;border:none;border-radius:8px;padding:12px 0;font-size:15px;font-weight:700;color:#fff;cursor:pointer}
  .bb-long{background:var(--green)} .bb-short{background:var(--red)}
  .bbar-btns button:active{opacity:.85}

  /* 图表设置面板：勾选卡片 */
  .cs-sec{font-size:12px;color:var(--sub);margin:2px 0 10px;display:flex;align-items:center;gap:4px}
  .chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .cchip{position:relative;border:1px solid var(--border);border-radius:10px;padding:12px 4px;text-align:center;font-size:13px;cursor:pointer;color:var(--txt);overflow:hidden}
  .cchip.on{border-color:#dfe3ea}
  .cchip.on::before{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 26px 26px 0;border-color:transparent #dfe3ea transparent transparent}
  .cchip.on::after{content:'✓';position:absolute;top:0;right:3px;font-size:10px;color:#0b0e11;font-weight:700}

  /* 快捷下单弹窗（币安式开/平仓面板） */
  .qo-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
  .qo-sym{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px}
  .qo-px{font-size:13px;font-weight:600;margin-top:3px}
  .qo-px small{font-weight:500;font-size:11px;margin-left:2px}
  .qo-chips{display:flex;gap:6px}
  .mini-chip{font-size:11px;border:1px solid var(--border);border-radius:7px;padding:5px 10px;color:var(--txt);cursor:pointer;background:var(--panel2)}
  .qo-tabs{display:flex;background:var(--bg);border-radius:9px;padding:3px;margin-bottom:12px}
  .qo-tabs span{flex:1;text-align:center;font-size:13px;color:var(--sub);padding:8px 0;border-radius:7px;cursor:pointer}
  .qo-tabs span.on{background:var(--panel2);color:var(--txt);font-weight:700}
  .qo-row{display:flex;gap:8px;margin-bottom:10px}
  .qo-inp{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
  .qo-inp.dis{opacity:.55}
  .qo-lbl{font-size:10px;color:var(--sub)}
  .qo-val{display:flex;align-items:center;gap:8px}
  .qo-val input{flex:1;width:0;background:none;border:none;outline:none;color:var(--txt);font-size:16px;font-weight:700;padding:2px 0}
  .qo-val input::placeholder{color:var(--sub2);font-size:13px;font-weight:500}
  .qo-unit{font-size:12px;color:var(--txt);font-weight:600;flex:none;cursor:pointer}
  .qo-umenu{position:absolute;right:8px;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:5;display:none;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  .qo-umenu.show{display:block}
  .qo-umenu div{font-size:12px;color:var(--sub);padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .qo-umenu div.on{color:var(--txt);background:var(--bg);font-weight:600}
  .qo-mkt{width:86px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--sub);cursor:pointer}
  .qo-mkt.on{color:var(--yellow);border-color:var(--yellow)}
  .qo-slide{position:relative;height:30px;margin:10px 2px 8px}
  .qo-ticks{position:absolute;left:6px;right:6px;top:14px;height:2px;background:#2a3139;display:flex;justify-content:space-between}
  .qo-ticks i{width:6px;height:6px;background:#3a424d;transform:rotate(45deg);margin-top:-2px}
  .qo-range{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;background:transparent;margin:0}
  .qo-range::-webkit-slider-runnable-track{height:30px;background:transparent}
  .qo-range::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:#eaecef;transform:rotate(45deg);border-radius:3px;cursor:pointer;margin-top:8.5px;box-shadow:0 0 0 2px #0b0e11}
  .qo-grid{font-size:12px;margin-bottom:14px}
  .qg-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
  .qo-grid span{color:var(--txt);border-bottom:1px dashed #3a424d;padding-bottom:1px}
  .qo-grid b{font-weight:600}
  .qg-swap{color:var(--yellow);margin-left:4px;font-weight:700}
  .qg-two{display:flex;justify-content:space-between;padding:5px 0}
  .qg-two>div{display:flex;justify-content:space-between;width:47%}
  .qo-btns{display:flex;gap:10px;margin-bottom:10px}
  .qo-btns button{flex:1;border:none;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:15px;cursor:pointer}
  .qo-btns button:active{opacity:.85}
  .qo-btns b{font-weight:800}
  .qo-btns small{font-size:11px;opacity:.9}
  .qo-long{background:var(--green)} .qo-short{background:var(--red)}
  .qo-link{text-align:center;font-size:12px;color:var(--sub);cursor:pointer;padding:2px 0 4px}

  /* 图上标签（持仓/委托/止盈止损/强平） */
  #overlays{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
  .tagline{position:absolute;left:6px;transform:translateY(-50%);display:flex;align-items:center;gap:0;pointer-events:auto;font-size:10px;border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap}
  .tagline .seg{padding:3px 6px;background:var(--panel2);display:flex;align-items:center;gap:4px}
  .tagline .act{padding:3px 7px;cursor:pointer;font-weight:600;border-left:1px solid rgba(255,255,255,.12)}
  .tagline.pos .seg{background:#2a3139}
  .tagline.pos .side-l{color:var(--green);font-weight:700}
  .tagline.pos .side-s{color:var(--red);font-weight:700}
  .tagline.pos .act{background:#2a3139;color:var(--txt)}
  .tagline.pos .act.close{color:var(--yellow)}
  .tagline.ord{cursor:grab}
  .tagline.ord .seg{background:rgba(21,26,33,.95)}
  .tagline.ord.buy .seg{color:var(--green);box-shadow:inset 2px 0 0 var(--green)}
  .tagline.ord.sell .seg{color:var(--red);box-shadow:inset 2px 0 0 var(--red)}
  .tagline.ord .act{background:rgba(21,26,33,.95);color:var(--sub)}
  .tagline.tp .seg{background:rgba(14,203,129,.18);color:var(--green)}
  .tagline.sl .seg{background:rgba(246,70,93,.18);color:var(--red)}
  .tagline.tp,.tagline.sl{cursor:grab}
  .tagline.tp .act,.tagline.sl .act{background:rgba(21,26,33,.9);color:var(--sub)}
  .tagline .drag-dot{font-size:8px;opacity:.6}

  /* ---------- 底部列表 ---------- */
  .bt{flex:1;display:flex;flex-direction:column;min-height:220px}
  .bt-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 12px;gap:18px;font-size:13px}
  .bt-tabs span{padding:9px 0;color:var(--sub);cursor:pointer;position:relative}
  .bt-tabs span.on{color:var(--txt);font-weight:600}
  .bt-tabs span.on::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--yellow)}
  .bt-tabs .cnt{font-size:11px}
  .bt-tabs .rt{margin-left:auto;font-size:11px;color:var(--sub);display:flex;align-items:center;gap:4px}
  .bt-body{flex:1;overflow-y:auto;padding:8px 12px 80px}
  .empty{text-align:center;color:var(--sub2);font-size:12px;padding:36px 0}

  .pos-card{background:var(--panel);border-radius:8px;padding:10px}
  .pc-r1{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .badge{font-size:10px;font-weight:700;border-radius:3px;padding:2px 6px}
  .badge.l{background:var(--green-bg);color:var(--green)} .badge.s{background:var(--red-bg);color:var(--red)}
  .pc-sym{font-size:13px;font-weight:600}
  .pc-lev{font-size:10px;color:var(--sub)}
  .pc-pnl{margin-left:auto;text-align:right}
  .pc-pnl .v{font-size:15px;font-weight:700}
  .pc-pnl .r{font-size:10px}
  .pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:10px;margin-bottom:10px}
  .pos-grid .k{color:var(--sub);margin-bottom:2px}
  .pos-grid .v{font-size:11px}
  .pc-btns{display:flex;gap:6px}
  .pc-btn{flex:1;background:var(--panel2);border:none;border-radius:6px;color:var(--txt);font-size:11px;padding:7px 0;cursor:pointer}
  .pc-btn:active{opacity:.7}
  .pc-btn.warn{color:var(--yellow)}

  .ord-row{background:var(--panel);border-radius:8px;padding:9px 10px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .ord-info{flex:1}
  .ord-r1{font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
  .ord-r2{font-size:10px;color:var(--sub);margin-top:3px;display:flex;gap:10px}
  .ord-x{background:var(--panel2);border:none;border-radius:5px;color:var(--sub);font-size:11px;padding:5px 10px;cursor:pointer}
  .side-t-b{color:var(--green)} .side-t-s{color:var(--red)}
  .cond{font-size:9px;border:1px solid var(--border);color:var(--sub);border-radius:3px;padding:1px 4px}

  .his-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #161b22;font-size:11px}
  .his-l{flex:1}
  .his-t1{font-weight:600}
  .his-t2{color:var(--sub2);font-size:10px;margin-top:2px}
  .his-r{text-align:right}

  /* ---------- 弹层 ---------- */
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.65);z-index:90;display:none;align-items:flex-end;justify-content:center}
  .mask.show{display:flex}
  .sheet{background:var(--panel);width:100%;border-radius:14px 14px 0 0;padding:16px 16px 24px;animation:up .18s ease-out;max-height:82vh;overflow-y:auto}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .sh-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .sh-x{color:var(--sub);font-size:16px;cursor:pointer;padding:0 4px}
  .frow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #1a212a;font-size:13px}
  .frow .k{color:var(--txt)} .frow .k small{display:block;color:var(--sub2);font-size:10px;margin-top:2px;font-weight:400}
  .switch{width:40px;height:22px;border-radius:11px;background:#2a3139;position:relative;cursor:pointer;transition:.15s}
  .switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
  .switch.on{background:var(--green)} .switch.on::after{left:20px}
  .seg-sel{display:flex;background:var(--bg);border-radius:6px;overflow:hidden;font-size:11px}
  .seg-sel span{padding:5px 12px;color:var(--sub);cursor:pointer}
  .seg-sel span.on{background:var(--panel2);color:var(--txt);font-weight:600}
  .inp-line{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 10px;margin-top:8px}
  .inp-line input{flex:1;background:none;border:none;color:var(--txt);font-size:14px;padding:11px 0;outline:none;font-weight:600}
  .inp-line .u{color:var(--sub);font-size:11px}
  .inp-line .lbl{color:var(--sub);font-size:11px;width:66px}
  .hint-pnl{font-size:11px;margin:6px 2px 2px;color:var(--sub)}
  .btn-main{width:100%;border:none;border-radius:8px;padding:13px 0;font-size:14px;font-weight:700;color:#181a20;background:var(--yellow);margin-top:16px;cursor:pointer}
  .btn-main.green{background:var(--green);color:#fff}
  .btn-main.red{background:var(--red);color:#fff}
  .btn-main:active{opacity:.85}
  .btn-ghost{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px 0;font-size:13px;color:var(--sub);background:none;margin-top:8px;cursor:pointer}
  .cfm-grid{background:var(--bg);border-radius:8px;padding:4px 12px;margin-top:4px}
  .lev-val{font-size:26px;font-weight:800;text-align:center;color:var(--yellow);margin:4px 0 10px}
  input[type=range]{width:100%;accent-color:var(--yellow);margin:6px 0 2px}
  .lev-marks{display:flex;justify-content:space-between;font-size:9px;color:var(--sub2)}
  .risk-tip{font-size:10px;color:var(--orange);background:rgba(246,166,35,.08);border-radius:6px;padding:8px 10px;margin-top:12px;line-height:1.5}

  /* toast */
  #toasts{position:absolute;top:70px;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
  .toast{background:rgba(28,35,45,.96);border:1px solid var(--border);color:var(--txt);font-size:12px;border-radius:8px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:tin .2s ease-out;display:flex;gap:6px;align-items:center;max-width:86%}
  .toast .ok{color:var(--green)} .toast .warn{color:var(--orange)} .toast .err{color:var(--red)}
  @keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="phone">

  <!-- 头部 -->
  <div class="hd">
    <div class="hd-row1">
      <span class="hd-sym">BTCUSDT</span><span class="hd-tag">永续</span>
      <span class="chip mode" id="chipMargin" onclick="openLev()">全仓</span>
      <span class="chip" id="chipLev" onclick="openLev()">20x</span>
      <div class="hd-right">
        <div class="icon-btn" title="图表设置" onclick="openSettings()">⚙</div>
      </div>
    </div>
    <div class="hd-row2">
      <div class="hd-price num up" id="hdPrice">--</div>
      <div class="hd-sub num">
        <div>24h涨跌 <b id="hd24" class="side-t-b">+2.35%</b>　24h量 <b>18.2万 BTC</b></div>
        <div>标记 <b id="hdMark">--</b>　资金费率 <b class="side-t-b">0.0100%</b> / <b id="hdFund">--:--:--</b></div>
      </div>
    </div>
  </div>

  <!-- 周期 -->
  <div class="tf" id="tfBar">
    <span>1m</span><span class="on">5m</span><span>15m</span><span>1H</span><span>4H</span><span>1D</span>
    <div class="sp"><span>指标</span><span>深度</span></div>
  </div>

  <!-- 图表 -->
  <div class="chart-wrap" id="chartWrap">
    <canvas id="cvs"></canvas>
    <div id="legend"></div>
    <div id="overlays"></div>

    <!-- 快捷下单：价格轴悬浮 + 号标签（拖动定价，点击弹出下单弹窗） -->
    <div id="quickPill">
      <span class="qp-plus" id="qpPlus"><i>＋</i></span>
      <span class="qp-info"><span class="num" id="qpPrice">--</span><span class="num" id="qpPct">--</span></span>
    </div>

  </div>

  <!-- 底部列表 -->
  <div class="bt">
    <div class="bt-tabs" id="btTabs">
      <span class="on" data-t="pos">持仓 <span class="cnt" id="cntPos">(0)</span></span>
      <span data-t="ord">当前委托 <span class="cnt" id="cntOrd">(0)</span></span>
      <span data-t="his">历史成交</span>
      <span class="rt" onclick="closeAllOrders()">一键撤单</span>
    </div>
    <div class="bt-body" id="btBody"></div>
  </div>

  <!-- 底部做多/做空栏 -->
  <div class="bbar">
    <div class="lsbar">
      <span class="ls-l num" id="lsL">多 67.50%</span>
      <div class="ls-track"><div class="ls-fill" id="lsFill"></div></div>
      <span class="ls-r num" id="lsR">32.50% 空</span>
    </div>
    <div class="bbar-btns">
      <button class="bb-long" onclick="quickMarket(1)">做多</button>
      <button class="bb-short" onclick="quickMarket(-1)">做空</button>
    </div>
  </div>

  <!-- 通用弹层 -->
  <div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
  <div id="toasts"></div>
</div>

<script>
/* =============== 工具 =============== */
const $=id=>document.getElementById(id);
const fmtP=p=>p.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtU=v=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtQ=v=>(+v.toFixed(4)).toString();
const now=()=>{const d=new Date();return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${d.toTimeString().slice(0,8)}`};
function toast(msg,cls='ok',icon='✓'){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span class="${cls}">${icon}</span><span>${msg}</span>`;
  $('toasts').appendChild(t);setTimeout(()=>t.remove(),2200);
}

/* =============== 状态 =============== */
const S={
  lev:20, marginMode:'全仓',
  qty:0.10,
  confirm2:false,              // 下单二次确认
  quickPrice:null,             // 悬浮 + 号标签所在价格
  show:{
    ord:true,marks:true,pos:true,dragEdit:true,quick:true,  // 订单显示
    cd:true,book:true                                        // 图层显示
  },
  balance:10000,               // USDT
  position:null,               // {side:1/-1,size,entry,tp,sl}
  orders:[],                   // {id,side,price,size}
  fills:[],                    // 图上成交标记 {ci,price,side,label}
  history:[],
  tab:'pos',
  crosshair:null,
  oid:1,
};

/* =============== 行情模拟 =============== */
let candles=[];
let last=104520;
(function init(){
  let p=104000,t=Date.now()-200*300000;
  for(let i=0;i<200;i++){
    const o=p, drift=(Math.random()-.48)*180;
    const c=o+drift, h=Math.max(o,c)+Math.random()*90, l=Math.min(o,c)-Math.random()*90;
    candles.push({t:t+i*300000,o,h,l,c,v:20+Math.random()*140});
    p=c;
  }
  last=p;
})();
let prevLast=last, tickN=0;
function tick(){
  tickN++;
  const k=candles[candles.length-1];
  prevLast=last;
  last=Math.max(100, last+(Math.random()-.5)*110+(Math.random()<.04?(Math.random()-.5)*400:0));
  k.c=last; k.h=Math.max(k.h,last); k.l=Math.min(k.l,last); k.v+=Math.random()*6;
  if(tickN%10===0){candles.push({t:k.t+300000,o:last,h:last,l:last,c:last,v:2});}
  checkTriggers();
  renderHeader(); render(); renderBottom(false);
}
setInterval(tick,700);

/* 资金费率倒计时 */
let fundSec=3600*2+35*60+12;
setInterval(()=>{fundSec=(fundSec-1+86400)%14400;
  const h=String(Math.floor(fundSec/3600)).padStart(2,'0'),m=String(Math.floor(fundSec%3600/60)).padStart(2,'0'),s=String(fundSec%60).padStart(2,'0');
  $('hdFund').textContent=`${h}:${m}:${s}`;
},1000);

/* =============== 头部渲染 =============== */
function renderHeader(){
  const el=$('hdPrice');
  el.textContent=fmtP(last);
  el.className='hd-price num '+(last>=prevLast?'up':'down');
  el.classList.remove('flash-up','flash-down');void el.offsetWidth;
  el.classList.add(last>=prevLast?'flash-up':'flash-down');
  $('hdMark').textContent=fmtP(last+3.5);
  /* 多空比小幅波动 */
  lsRatio=Math.max(35,Math.min(80,lsRatio+(Math.random()-.5)*1.2));
  $('lsL').textContent=`多 ${lsRatio.toFixed(2)}%`;
  $('lsR').textContent=`${(100-lsRatio).toFixed(2)}% 空`;
  $('lsFill').style.width=lsRatio+'%';
}
let lsRatio=67.5;

/* =============== 图表 =============== */
const cvs=$('cvs'), ctx=cvs.getContext('2d');
const PAD_R=62, PAD_T=6, PAD_B=18, VOL_H=46;
let cw=7, view={offset:0};
function fit(){
  const r=cvs.getBoundingClientRect(),d=devicePixelRatio||1;
  cvs.width=r.width*d; cvs.height=r.height*d; ctx.setTransform(d,0,0,d,0,0);
  return r;
}
let geo={};
function render(){
  const r=fit(), W=r.width, H=r.height;
  const priceB=H-PAD_B-VOL_H-4;
  const count=Math.floor((W-PAD_R)/cw);
  view.offset=Math.max(0,Math.min(view.offset,candles.length-count));
  const start=Math.max(0,candles.length-count-view.offset);
  const vis=candles.slice(start,start+count);
  let mn=Infinity,mx=-Infinity,mv=0;
  vis.forEach(k=>{mn=Math.min(mn,k.l);mx=Math.max(mx,k.h);mv=Math.max(mv,k.v);});
  const pad=(mx-mn)*.08; mn-=pad; mx+=pad;
  const y=p=>PAD_T+(mx-p)/(mx-mn)*(priceB-PAD_T);
  const yInv=py=>mx-(py-PAD_T)/(priceB-PAD_T)*(mx-mn);
  const x=i=>(i-start)*cw+cw/2;
  geo={y,x,start,count,mn,mx,W,H,priceB,yInv};

  ctx.fillStyle='#0b0e11';ctx.fillRect(0,0,W,H);
  /* 网格 */
  ctx.strokeStyle='#161c24';ctx.fillStyle='#5e6673';ctx.font='9px -apple-system';ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const gy=PAD_T+(priceB-PAD_T)*i/4;
    ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W-PAD_R,gy);ctx.stroke();
    ctx.fillText(fmtP(yInv(gy)),W-PAD_R+6,gy);
  }
  /* 时间轴 */
  for(let i=0;i<vis.length;i+=Math.ceil(count/4)){
    const d=new Date(vis[i].t);
    ctx.fillText(`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,x(start+i)-12,H-8);
  }
  /* 成交量 */
  vis.forEach((k,i)=>{
    ctx.fillStyle=k.c>=k.o?'rgba(14,203,129,.35)':'rgba(246,70,93,.35)';
    const vh=k.v/mv*VOL_H;
    ctx.fillRect(x(start+i)-cw*.36,H-PAD_B-vh,cw*.72,vh);
  });
  /* K线 */
  vis.forEach((k,i)=>{
    const up=k.c>=k.o,cx=x(start+i);
    ctx.strokeStyle=ctx.fillStyle=up?'#0ecb81':'#f6465d';
    ctx.beginPath();ctx.moveTo(cx,y(k.h));ctx.lineTo(cx,y(k.l));ctx.stroke();
    const t=y(Math.max(k.o,k.c)),b=y(Math.min(k.o,k.c));
    ctx.fillRect(cx-cw*.36,t,cw*.72,Math.max(1,b-t));
  });
  /* MA7 / MA25 */
  drawMA(7,'#f0b90b');drawMA(25,'#b385f6');
  function drawMA(n,col){
    ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();let started=false;
    for(let i=Math.max(start,n-1);i<start+vis.length;i++){
      let s=0;for(let j=i-n+1;j<=i;j++)s+=candles[j].c;
      const py=y(s/n);if(py<PAD_T-20||py>priceB+20){started=false;continue}
      started?ctx.lineTo(x(i),py):(ctx.moveTo(x(i),py),started=true);
    }
    ctx.stroke();
  }
  /* 最新价线 */
  drawHLine(last, last>=prevLast?'#0ecb81':'#f6465d', fmtP(last), true);
  /* 倒计时（当根K线剩余时间，挂在最新价签下方） */
  const lpy=y(last);
  if(S.show.cd&&lpy>=PAD_T&&lpy<=priceB-24){
    const cs=300-Math.floor(Date.now()/1000)%300;
    ctx.fillStyle='#1c232d';ctx.fillRect(W-PAD_R,lpy+10,PAD_R-2,14);
    ctx.fillStyle='#848e9c';ctx.fillText(`${String(Math.floor(cs/60)).padStart(2,'0')}:${String(cs%60).padStart(2,'0')}`,W-PAD_R+14,lpy+17);
  }
  /* 盘口价格（买一/卖一贴纸，靠在价格轴内侧） */
  if(S.show.book){
    const chip=(txt,py,col)=>{
      if(py<PAD_T||py>priceB)return;
      ctx.fillStyle=col;const w2=64;
      ctx.fillRect(W-PAD_R-w2-3,py-7,w2,14);
      ctx.fillStyle='#fff';ctx.fillText(txt,W-PAD_R-w2+2,py);
    };
    chip('卖 '+fmtP(last+2.5),lpy-18,'#f6465d');
    chip('买 '+fmtP(last-2.5),lpy+18,'#0ecb81');
  }
  /* 快捷下单 + 号标签引导线（点击K线图后才出现） */
  if(S.show.quick&&S.quickPrice!=null){
    const qy=y(S.quickPrice);
    if(qy>=PAD_T&&qy<=priceB){
      ctx.strokeStyle='rgba(132,142,156,.55)';ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(0,qy);ctx.lineTo(W-PAD_R,qy);ctx.stroke();ctx.setLineDash([]);
    }
  }
  /* 持仓/强平/委托/止盈止损线 */
  const P=S.position;
  if(P&&S.show.pos){
    drawHLine(P.entry, P.side>0?'#0ecb81':'#f6465d', fmtP(P.entry), false, [4,4]);
    if(P.tp) drawHLine(P.tp,'#0ecb81',fmtP(P.tp),false,[6,3]);
    if(P.sl) drawHLine(P.sl,'#f6465d',fmtP(P.sl),false,[6,3]);
  }
  if(S.show.ord) S.orders.forEach(o=>drawHLine(o.price, o.side>0?'#0ecb81':'#f6465d', fmtP(o.price), false,[1,3]));
  /* 成交标记：同根K线同方向多笔成交合并为一个印记（B/S 各至多一个），均价点击印记查看 */
  if(S.show.marks){
    const seen=new Set();
    S.fills.forEach(f=>{
      if(f.ci<start||f.ci>=start+count)return;
      const key=f.ci+'_'+f.side;
      if(seen.has(key))return;
      seen.add(key);
      const fx=x(f.ci);
      if(f.side>0)badge(fx,y(candles[f.ci].l)+13,'B','#0ecb81');
      else badge(fx,y(candles[f.ci].h)-13,'S','#f6465d');
    });
  }
  ctx.textBaseline='middle';
  /* 圆角徽标印记（绿B/红S，白字） */
  function badge(tx,ty,letter,col){
    const w=13,h=13,r=3.5;
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(tx-w/2+r,ty-h/2);
    ctx.arcTo(tx+w/2,ty-h/2,tx+w/2,ty+h/2,r);
    ctx.arcTo(tx+w/2,ty+h/2,tx-w/2,ty+h/2,r);
    ctx.arcTo(tx-w/2,ty+h/2,tx-w/2,ty-h/2,r);
    ctx.arcTo(tx-w/2,ty-h/2,tx+w/2,ty-h/2,r);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 8px -apple-system';
    ctx.textAlign='center';
    ctx.fillText(letter,tx,ty+.5);
    ctx.textAlign='start';
  }
  /* 十字光标 */
  if(S.crosshair){
    const {cy}=S.crosshair;
    /* 锚定蜡烛索引的光标（印记点击）跟随蜡烛移动；像素光标（长按）保持原位 */
    const cx=S.crosshair.ci!=null?x(S.crosshair.ci):S.crosshair.cx;
    ctx.strokeStyle='rgba(132,142,156,.6)';ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(cx,PAD_T);ctx.lineTo(cx,H-PAD_B);ctx.moveTo(0,cy);ctx.lineTo(W-PAD_R,cy);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#2a3139';ctx.fillRect(W-PAD_R,cy-8,PAD_R,16);
    ctx.fillStyle='#eaecef';ctx.fillText(fmtP(geo.yInv(cy)),W-PAD_R+6,cy);
    const ci=S.crosshair.ci!=null?S.crosshair.ci:start+Math.round((cx-cw/2)/cw), k=candles[ci];
    $('legend').innerHTML=k?`MA(7) <b style="color:#f0b90b">${fmtP(ma(ci,7))}</b>　MA(25) <b style="color:#b385f6">${fmtP(ma(ci,25))}</b>${xcard(ci,k)}`:'';
  }else{
    $('legend').innerHTML=`MA(7) <b style="color:#f0b90b">${fmtP(ma(candles.length-1,7))}</b>　MA(25) <b style="color:#b385f6">${fmtP(ma(candles.length-1,25))}</b>`;
  }
  function ma(i,n){let s=0,c2=0;for(let j=Math.max(0,i-n+1);j<=i;j++){s+=candles[j].c;c2++}return s/c2}
  /* 十字光标K线信息卡：时间/开/高/低/收/涨跌/涨跌幅/振幅/量/额 + 底部买卖均价 */
  function xcard(ci,k){
    const d=new Date(k.t);
    const tm=`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')},${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const chg=k.c-k.o, chgP=chg/k.o*100, amp=(k.h-k.l)/k.o*100;
    const cc=chg>=0?'var(--green)':'var(--red)';
    const row=(lb,v,col)=>`<div class="xr"><span>${lb}</span><b class="num"${col?` style="color:${col}"`:''}>${v}</b></div>`;
    return `<div class="xcard">`+
      row('时间',tm)+row('开',fmtP(k.o))+row('高',fmtP(k.h))+row('低',fmtP(k.l))+row('收',fmtP(k.c))+
      row('涨跌',(chg>=0?'+':'')+fmtP(chg),cc)+row('涨跌幅',(chgP>=0?'+':'')+chgP.toFixed(2)+'%',cc)+
      row('振幅',amp.toFixed(2)+'%')+row('量',k.v.toFixed(2))+row('额',(k.v*k.c/10000).toFixed(2)+'万')+
      fillRows(ci)+`</div>`;
  }
  /* 该根K线的买卖均价行（数量加权，展示在信息卡底部） */
  function fillRows(ci){
    if(!S.show.marks)return '';
    const fs=S.fills.filter(f=>f.ci===ci);
    if(!fs.length)return '';
    const agg=side=>{
      const a=fs.filter(f=>f.side===side);
      if(!a.length)return null;
      const qty=a.reduce((s2,f)=>s2+(f.size||0),0);
      return {qty,avg:qty>0?a.reduce((s2,f)=>s2+f.price*(f.size||0),0)/qty:a[0].price};
    };
    const b=agg(1),s=agg(-1);let h='';
    if(b)h+=`<div class="xr fillr"><b class="num" style="color:var(--green)">买${fmtQ(b.qty)}@${fmtP(b.avg)} ›</b></div>`;
    if(s)h+=`<div class="xr ${b?'':'fillr'}"><b class="num" style="color:var(--red)">卖${fmtQ(s.qty)}@${fmtP(s.avg)} ›</b></div>`;
    return h;
  }
  function drawHLine(p,col,label,chipBg,dash){
    const py=y(p); if(py<PAD_T-1||py>priceB+1)return;
    ctx.strokeStyle=col;ctx.lineWidth=1;ctx.setLineDash(dash||[5,3]);
    ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W-PAD_R,py);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=chipBg?col:'#0b0e11';
    ctx.fillRect(W-PAD_R,py-8,PAD_R-2,16);
    if(!chipBg){ctx.strokeStyle=col;ctx.strokeRect(W-PAD_R+.5,py-7.5,PAD_R-3,15);}
    ctx.fillStyle=chipBg?'#fff':col;ctx.fillText(label,W-PAD_R+5,py);
  }
  syncTags();
  positionPill();
}
/* 悬浮 + 号标签定位 */
function positionPill(){
  const el=$('quickPill');
  if(!S.show.quick||S.quickPrice==null){el.style.display='none';return}
  const py=geo.y(S.quickPrice);
  if(py<PAD_T+6||py>geo.priceB-6){el.style.display='none';return}
  el.style.display='flex';
  el.style.top=py+'px';
  $('qpPrice').textContent=fmtP(S.quickPrice);
  const pct=(S.quickPrice/last-1)*100;
  const pe=$('qpPct');
  pe.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';
  pe.style.color=pct>=0?'var(--green)':'var(--red)';
}

/* =============== 图上标签(DOM) =============== */
const ovl=$('overlays'), tagEls=new Map();
function syncTags(){
  const want=[];
  const P=S.position;
  if(P&&S.show.pos){
    const pnl=(last-P.entry)*P.size*P.side, roe=pnl/(P.entry*P.size/S.lev)*100;
    want.push({id:'pos',cls:'pos',price:P.entry,html:
      `<span class="seg"><span class="${P.side>0?'side-l':'side-s'}">${P.side>0?'多':'空'} ${fmtQ(P.size)}</span><span class="num" style="color:${pnl>=0?'var(--green)':'var(--red)'}">${pnl>=0?'+':''}${fmtU(pnl)} (${roe>=0?'+':''}${roe.toFixed(2)}%)</span></span><span class="act" data-act="tpsl">TP/SL</span><span class="act" data-act="rev">反手</span><span class="act close" data-act="close">平</span>`});
    if(P.tp) want.push({id:'tp',cls:'tp',price:P.tp,drag:'tp',html:`<span class="seg"><span class="drag-dot">⠿</span>止盈 <span class="num" data-p>${fmtP(P.tp)}</span></span><span class="act" data-act="rmtp">✕</span>`});
    if(P.sl) want.push({id:'sl',cls:'sl',price:P.sl,drag:'sl',html:`<span class="seg"><span class="drag-dot">⠿</span>止损 <span class="num" data-p>${fmtP(P.sl)}</span></span><span class="act" data-act="rmsl">✕</span>`});
  }
  if(S.show.ord) S.orders.forEach(o=>{
    want.push({id:'o'+o.id,cls:'ord '+(o.side>0?'buy':'sell'),price:o.price,drag:'o'+o.id,html:
      `<span class="seg"><span class="drag-dot">⠿</span>限价${o.side>0?'买':'卖'} ${fmtQ(o.size)} @ <span class="num" data-p>${fmtP(o.price)}</span></span><span class="act" data-act="cancel" data-id="${o.id}">✕</span>`});
  });
  const ids=new Set(want.map(w=>w.id));
  [...tagEls.keys()].forEach(k=>{if(!ids.has(k)){tagEls.get(k).remove();tagEls.delete(k)}});
  want.forEach(w=>{
    let el=tagEls.get(w.id);
    if(!el){el=document.createElement('div');el.dataset.tid=w.id;if(w.drag)el.dataset.drag=w.drag;ovl.appendChild(el);tagEls.set(w.id,el);}
    el.className='tagline '+w.cls;
    if(dragTag!==w.id) el.innerHTML=w.html;
    else {const ps=el.querySelector('[data-p]');if(ps)ps.textContent=fmtP(w.price);}
    const py=geo.y(w.price);
    el.style.display=(py<PAD_T||py>geo.priceB)?'none':'flex';
    el.style.top=py+'px';
  });
}
/* 标签按钮（事件委托） */
ovl.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='close') confirmClose();
  else if(act==='rev') reversePos();
  else if(act==='tpsl') openTPSL();
  else if(act==='cancel') cancelOrder(+a.dataset.id);
  else if(act==='rmtp'){S.position.tp=null;toast('已撤销止盈');render();renderBottom();}
  else if(act==='rmsl'){S.position.sl=null;toast('已撤销止损');render();renderBottom();}
});
/* 标签拖拽改价 */
let dragTag=null;
ovl.addEventListener('pointerdown',e=>{
  if(!S.show.dragEdit)return;   /* 设置中的「K线改单」开关 */
  const el=e.target.closest('[data-drag]');
  if(!el||e.target.closest('[data-act]'))return;
  dragTag=el.dataset.tid; el.setPointerCapture(e.pointerId);
  e.stopPropagation();
});
ovl.addEventListener('pointermove',e=>{
  if(!dragTag)return;
  const rect=cvs.getBoundingClientRect();
  const p=Math.round(geo.yInv(e.clientY-rect.top)*10)/10;
  if(p<=0)return;
  if(dragTag==='tp')S.position.tp=p;
  else if(dragTag==='sl')S.position.sl=p;
  else{const o=S.orders.find(o=>'o'+o.id===dragTag);if(o)o.price=p;}
  render();
});
ovl.addEventListener('pointerup',()=>{
  if(!dragTag)return;
  const t=dragTag;dragTag=null;
  toast(t==='tp'?'止盈价已修改':t==='sl'?'止损价已修改':'委托价已修改，重新排队');
  render();renderBottom();
});

/* =============== 图表手势：拖动平移 / 点按 =============== */
let pd=null;
cvs.addEventListener('pointerdown',e=>{
  pd={x:e.clientX,y:e.clientY,off:view.offset,t:Date.now(),moved:false,long:false};
  /* 长按 400ms 唤起十字光标（快捷下单占用了单击） */
  pd.lp=setTimeout(()=>{
    if(!pd||pd.moved)return;
    pd.long=true;
    const rect=cvs.getBoundingClientRect();
    S.crosshair={cx:pd.x-rect.left,cy:pd.y-rect.top};
    render();
  },400);
  cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove',e=>{
  if(!pd)return;
  const dx=e.clientX-pd.x;
  if(Math.abs(dx)>5||Math.abs(e.clientY-pd.y)>5){pd.moved=true;clearTimeout(pd.lp);}
  if(pd.moved&&!pd.long){S.crosshair=null;view.offset=pd.off+Math.round(dx/cw);render();}
});
cvs.addEventListener('pointerup',e=>{
  if(!pd)return;
  clearTimeout(pd.lp);
  const wasLong=pd.long, tap=!pd.moved&&!wasLong&&Date.now()-pd.t<450; pd=null;
  if(wasLong||!tap)return;
  const rect=cvs.getBoundingClientRect(), cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  if(cx>geo.W-PAD_R)return;
  if(S.crosshair){S.crosshair=null;render();return}
  /* 点击带 B/S 印记的蜡烛：十字光标吸附该蜡烛，OHLC面板内显示买卖均价 */
  if(S.show.marks){
    const ci=geo.start+Math.round((cx-cw/2)/cw);
    if(ci>=0&&ci<candles.length&&S.fills.some(f=>f.ci===ci)){
      S.crosshair={ci,cy:geo.y(candles[ci].c)};
      render();return;
    }
  }
  if(S.show.quick){
    /* 点击K线图：在点击价位出现 + 号标签；点在已有标签价位附近则收起 */
    if(S.quickPrice!=null&&Math.abs(geo.y(S.quickPrice)-cy)<14){S.quickPrice=null;}
    else S.quickPrice=Math.round(geo.yInv(cy)*10)/10;
    render();return;
  }
  S.crosshair={cx,cy};
  render();
});

/* =============== 交易核心 =============== */
function liqPrice(P){return P.side>0?P.entry*(1-0.9/S.lev):P.entry*(1+0.9/S.lev)}
function markFill(price,side,size,label){S.fills.push({ci:candles.length-1,price,side,size,label})}
function addHistory(h){S.history.unshift({time:now(),...h})}

/* 底部做多/做空（市价，走二次确认设置） */
function quickMarket(side){
  if(!(S.qty>0))return toast('请输入有效数量','err','!');
  placeOrder({type:'market',side,size:S.qty});
}
function placeOrder(o){
  const exec=()=>{
    if(o.type==='market'){
      const px=o.side>0?last+2.5:last-2.5;
      fillOrder(o.side,px,o.size,'市价');

    }else{
      S.orders.push({id:S.oid++,side:o.side,price:o.price,size:o.size});
      addHistory({text:`限价${o.side>0?'买入':'卖出'}委托`,side:o.side,price:o.price,size:o.size,type:'委托'});
      toast(`限价${o.side>0?'买':'卖'}单已提交 @ ${fmtP(o.price)}`);
    }
    render();renderBottom();
  };
  if(!S.confirm2){exec();return}
  const px=o.type==='market'?(o.side>0?last+2.5:last-2.5):o.price;
  openSheet(`
    <div class="sh-title">确认下单<span class="sh-x" onclick="closeSheet()">✕</span></div>
    <div class="cfm-grid">
      <div class="frow"><span class="k" style="color:var(--sub)">方向</span><b class="${o.side>0?'side-t-b':'side-t-s'}">${o.side>0?'买入 / 做多':'卖出 / 做空'}</b></div>
      <div class="frow"><span class="k" style="color:var(--sub)">类型</span><b>${o.type==='market'?'市价委托':'限价委托'} · ${S.marginMode} ${S.lev}x</b></div>
      <div class="frow"><span class="k" style="color:var(--sub)">价格</span><b class="num">${o.type==='market'?'≈ ':''}${fmtP(px)} USDT</b></div>
      <div class="frow"><span class="k" style="color:var(--sub)">数量</span><b class="num">${fmtQ(o.size)} BTC ≈ ${fmtU(o.size*px)} USDT</b></div>
      <div class="frow" style="border:none"><span class="k" style="color:var(--sub)">所需保证金</span><b class="num">${fmtU(o.size*px/S.lev)} USDT</b></div>
    </div>
    <button class="btn-main ${o.side>0?'green':'red'}" id="cfmOk">确认${o.side>0?'买入':'卖出'}</button>
    <button class="btn-ghost" onclick="closeSheet()">取消</button>
    <div style="text-align:center;margin-top:10px"><label style="font-size:11px;color:var(--sub)"><input type="checkbox" id="cfmSkip"> 不再提示（可在设置中恢复）</label></div>`);
  $('cfmOk').onclick=()=>{if($('cfmSkip').checked){S.confirm2=false;}closeSheet();exec();};
}
function fillOrder(side,price,size,label){
  markFill(price,side,size,label);
  addHistory({text:`${label}${side>0?'买入':'卖出'}成交`,side,price,size,type:'成交'});
  let P=S.position;
  if(!P){S.position={side,size,entry:price,tp:null,sl:null};}
  else if(P.side===side){P.entry=(P.entry*P.size+price*size)/(P.size+size);P.size+=size;}
  else{
    const closeSz=Math.min(P.size,size);
    const pnl=(price-P.entry)*closeSz*P.side;
    S.balance+=pnl;
    addHistory({text:`平仓已实现盈亏 ${pnl>=0?'+':''}${fmtU(pnl)} USDT`,side:-P.side,price,size:closeSz,type:'平仓'});
    if(size>P.size){S.position={side,size:size-P.size,entry:price,tp:null,sl:null};}
    else if(size===P.size){S.position=null;}
    else{P.size-=size;}
  }
}
function cancelOrder(id){
  const i=S.orders.findIndex(o=>o.id===id);if(i<0)return;
  const o=S.orders[i];S.orders.splice(i,1);
  addHistory({text:'撤销委托',side:o.side,price:o.price,size:o.size,type:'撤单'});
  toast('委托已撤销');render();renderBottom();
}
function closeAllOrders(){
  if(!S.orders.length)return toast('暂无可撤委托','warn','!');
  S.orders=[];toast('已撤销全部委托');render();renderBottom();
}
function confirmClose(){
  const P=S.position;if(!P)return;
  const pnl=(last-P.entry)*P.size*P.side;
  openSheet(`
    <div class="sh-title">市价平仓<span class="sh-x" onclick="closeSheet()">✕</span></div>
    <div class="cfm-grid">
      <div class="frow"><span class="k" style="color:var(--sub)">持仓</span><b class="${P.side>0?'side-t-b':'side-t-s'}">${P.side>0?'多':'空'} ${fmtQ(P.size)} BTC</b></div>
      <div class="frow"><span class="k" style="color:var(--sub)">开仓均价</span><b class="num">${fmtP(P.entry)}</b></div>
      <div class="frow" style="border:none"><span class="k" style="color:var(--sub)">预计盈亏</span><b class="num" style="color:${pnl>=0?'var(--green)':'var(--red)'}">${pnl>=0?'+':''}${fmtU(pnl)} USDT</b></div>
    </div>
    <button class="btn-main" id="closeOk">确认全部平仓</button>
    <button class="btn-ghost" onclick="closeSheet()">取消</button>`);
  $('closeOk').onclick=()=>{closeSheet();closePosition('市价平仓');};
}
function closePosition(label,px){
  const P=S.position;if(!P)return;
  const price=px??(P.side>0?last-2.5:last+2.5);
  const pnl=(price-P.entry)*P.size*P.side;
  S.balance+=pnl;
  markFill(price,-P.side,P.size,label);
  addHistory({text:`${label} 盈亏 ${pnl>=0?'+':''}${fmtU(pnl)} USDT`,side:-P.side,price,size:P.size,type:'平仓'});
  S.position=null;
  toast(`${label}成功，已实现盈亏 ${pnl>=0?'+':''}${fmtU(pnl)} USDT`,pnl>=0?'ok':'err',pnl>=0?'✓':'!');
  render();renderBottom();
}
function reversePos(){
  const P=S.position;if(!P)return;
  const sz=P.size,side=-P.side;
  closePosition('反手平仓');
  const px=side>0?last+2.5:last-2.5;
  fillOrder(side,px,sz,'反手');
  toast(`一键反手：${side>0?'开多':'开空'} ${fmtQ(sz)} BTC @ ${fmtP(px)}`);
  render();renderBottom();
}
/* 触发检查：限价成交 / 止盈止损 / 强平 */
function checkTriggers(){
  for(let i=S.orders.length-1;i>=0;i--){
    const o=S.orders[i];
    if((o.side>0&&last<=o.price)||(o.side<0&&last>=o.price)){
      S.orders.splice(i,1);
      fillOrder(o.side,o.price,o.size,'限价');
      toast(`限价单成交：${o.side>0?'买入':'卖出'} ${fmtQ(o.size)} @ ${fmtP(o.price)}`);
    }
  }
  const P=S.position;if(!P)return;
  if(P.tp&&((P.side>0&&last>=P.tp)||(P.side<0&&last<=P.tp)))return closePosition('止盈触发',P.tp);
  if(P.sl&&((P.side>0&&last<=P.sl)||(P.side<0&&last>=P.sl)))return closePosition('止损触发',P.sl);
  const lq=liqPrice(P);
  if((P.side>0&&last<=lq)||(P.side<0&&last>=lq)){closePosition('强制平仓',lq);toast('仓位已被强制平仓','err','!');}
}

    if(P&&P.sl) h+=condRow('止损','side-t-s',P.sl,P.size,'rmsl');
    b.innerHTML=h||`<div class="empty">暂无当前委托<br><span style="font-size:10px">限价模式下点击图表任意价格即可挂单</span></div>`;
    function condRow(name,cls,p,sz,act){
      return `<div class="ord-row">
        <div class="ord-info">
          <div class="ord-r1"><span class="${cls}">${name}</span> BTCUSDT <span class="cond">条件单·市价触发</span></div>
          <div class="ord-r2 num"><span>触发价 ${fmtP(p)}</span><span>数量 ${fmtQ(sz)} BTC</span><span>可在图上拖动改价</span></div>
        </div>
        <button class="ord-x" onclick="rmCond('${act}')">撤销</button>
      </div>`;
    }
  }else{
    if(!S.history.length){b.innerHTML='<div class="empty">暂无历史记录</div>';return}
    b.innerHTML=S.history.slice(0,50).map(h=>`
      <div class="his-row">
        <div class="his-l"><div class="his-t1"><span class="${h.side>0?'side-t-b':'side-t-s'}">${h.side>0?'买':'卖'}</span> ${h.text}</div><div class="his-t2">${h.time} · ${h.type}</div></div>
        <div class="his-r num"><div>${fmtP(h.price)}</div><div style="color:var(--sub);font-size:10px">${fmtQ(h.size)} BTC</div></div>
      </div>`).join('');
  }
}
function rmCond(act){
  if(act==='rmtp')S.position.tp=null;else S.position.sl=null;
  toast('条件单已撤销');render();renderBottom();
}

/* =============== 弹层 =============== */
function openSheet(html){$('sheet').innerHTML=html;$('mask').classList.add('show')}
function closeSheet(){$('mask').classList.remove('show')}
$('mask').addEventListener('click',e=>{if(e.target===$('mask'))closeSheet()});

function openTPSL(){
  const P=S.position;if(!P)return toast('暂无持仓','warn','!');
  openSheet(`
    <div class="sh-title">止盈 / 止损<span class="sh-x" onclick="closeSheet()">✕</span></div>
    <div style="font-size:11px;color:var(--sub);margin-bottom:4px">当前持仓：<b class="${P.side>0?'side-t-b':'side-t-s'}">${P.side>0?'多':'空'} ${fmtQ(P.size)} BTC</b> · 开仓均价 <b class="num" style="color:var(--txt)">${fmtP(P.entry)}</b> · 最新价 <b class="num" style="color:var(--txt)">${fmtP(last)}</b></div>
    <div class="inp-line"><span class="lbl">止盈价</span><input id="tpIn" class="num" inputmode="decimal" placeholder="选填" value="${P.tp||''}"><span class="u">USDT</span></div>
    <div class="hint-pnl" id="tpHint">预计盈利 --</div>
    <div class="inp-line"><span class="lbl">止损价</span><input id="slIn" class="num" inputmode="decimal" placeholder="选填" value="${P.sl||''}"><span class="u">USDT</span></div>
    <div class="hint-pnl" id="slHint">预计亏损 --</div>
    <div class="risk-tip">触发后按市价全部平仓；设置完成后可直接在 K 线图上拖动止盈/止损线调整价格。</div>
    <button class="btn-main" id="tpslOk">确认设置</button>`);
  const calc=()=>{
    const tp=parseFloat($('tpIn').value),sl=parseFloat($('slIn').value);
    $('tpHint').textContent=tp>0?`预计盈利 ${fmtU((tp-P.entry)*P.size*P.side)} USDT`:'预计盈利 --';
    $('slHint').textContent=sl>0?`预计亏损 ${fmtU((sl-P.entry)*P.size*P.side)} USDT`:'预计亏损 --';
  };
  $('tpIn').oninput=calc;$('slIn').oninput=calc;calc();
  $('tpslOk').onclick=()=>{
    const tp=parseFloat($('tpIn').value),sl=parseFloat($('slIn').value);
    if(tp>0&&((P.side>0&&tp<=last)||(P.side<0&&tp>=last)))return toast('止盈价方向不正确','err','!');
    if(sl>0&&((P.side>0&&sl>=last)||(P.side<0&&sl<=last)))return toast('止损价方向不正确','err','!');
    P.tp=tp>0?tp:null;P.sl=sl>0?sl:null;
    closeSheet();toast('止盈止损已设置，可在图上拖动调整');render();renderBottom();
  };
}
function openLev(){
  openSheet(`
    <div class="sh-title">调整杠杆<span class="sh-x" onclick="closeSheet()">✕</span></div>
    <div class="frow"><span class="k">保证金模式</span>
      <div class="seg-sel" id="mmSel"><span class="${S.marginMode==='全仓'?'on':''}">全仓</span><span class="${S.marginMode==='逐仓'?'on':''}">逐仓</span></div>
    </div>
    <div class="lev-val" id="levV">${S.lev}x</div>
    <input type="range" min="1" max="125" value="${S.lev}" id="levR">
    <div class="lev-marks"><span>1x</span><span>25x</span><span>50x</span><span>75x</span><span>100x</span><span>125x</span></div>
    <div class="risk-tip">当前杠杆最大可开 <b class="num" id="levMax">--</b> BTC；调整杠杆将同时影响持仓的保证金与强平价格，请注意风险。</div>
    <button class="btn-main" id="levOk">确认</button>`);
  const upd=v=>{$('levV').textContent=v+'x';$('levMax').textContent=fmtQ(S.balance*v/last)};
  upd(S.lev);
  $('levR').oninput=e=>upd(+e.target.value);
  $('mmSel').onclick=e=>{if(e.target.tagName!=='SPAN')return;[...$('mmSel').children].forEach(c=>c.classList.toggle('on',c===e.target));};
  $('levOk').onclick=()=>{
    S.lev=+$('levR').value;
    S.marginMode=$('mmSel').querySelector('.on').textContent;
    $('chipLev').textContent=S.lev+'x';$('chipMargin').textContent=S.marginMode;
    closeSheet();toast(`已切换为 ${S.marginMode} ${S.lev}x`);renderHeader();render();renderBottom();
  };
}
function openSettings(){
  const chip=(k,label)=>`<div class="cchip ${S.show[k]?'on':''}" data-s="${k}">${label}</div>`;
  openSheet(`
    <div class="cs-sec">订单显示</div>
    <div class="chip-grid">
      ${chip('ord','当前委托')}${chip('marks','历史委托')}
      ${chip('pos','仓位')}${chip('dragEdit','K线改单')}
      ${chip('quick','快捷下单')}
    </div>
    <div class="cs-sec">图层显示</div>
    <div class="chip-grid">
      ${chip('cd','倒计时')}${chip('book','盘口价格')}
    </div>
    <div class="frow" style="border:none"><span class="k">下单二次确认<small>开启后做多/做空需确认弹窗</small></span><div class="switch ${S.confirm2?'on':''}" id="swCfm"></div></div>
    <button class="btn-main" onclick="closeSheet()">完成</button>`);
  $('sheet').querySelectorAll('.cchip').forEach(c=>{
    c.onclick=()=>{
      const k=c.dataset.s, on=!S.show[k];
      S.show[k]=on; c.classList.toggle('on',on);
      if(k==='quick'&&!on)S.quickPrice=null;
      render();
    };
  });
  $('swCfm').onclick=()=>{S.confirm2=!S.confirm2;$('swCfm').classList.toggle('on',S.confirm2);};
}
